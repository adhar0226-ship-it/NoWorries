<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Caterer Portal — NOWORRIES</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#211d19">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* 1. TOKENS & BASE (shared identity with Host Portal) */
:root{
  --paper:#faf7f2; --surface:#ffffff; --ink:#211d19; --text:#1e1b18; --muted:#6a625a;
  --line:#e6dfd2; --line-strong:#d4cbbd; --rust:#b8470f; --rust-hover:#9f3c0b; --rust-soft:#f6e6dc;
  --sage:#5f7a66; --sage-soft:#e3ece6; --danger:#b3261e; --danger-soft:#fbe9e7; --warn-soft:#fbf1dc; --warn:#8a5a00;
  --font-display:'Playfair Display',Georgia,serif;
  --font-body:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --r:8px; --r-lg:12px; --side:244px; --bottom:64px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px;-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--text);font-family:var(--font-body);line-height:1.55;-webkit-font-smoothing:antialiased;min-height:100vh}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
:focus-visible{outline:2px solid var(--rust);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
h1,h2,h3{font-family:var(--font-display);font-weight:700;letter-spacing:-.01em;line-height:1.2}
.muted{color:var(--muted)} .hidden{display:none!important}

/* 2. BUTTONS, FIELDS, FEEDBACK */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:var(--r);font-weight:600;font-size:.93rem;border:1.5px solid transparent;transition:background .2s,border-color .2s,color .2s,transform .15s;white-space:nowrap}
.btn:active{transform:translateY(1px)} .btn[disabled]{opacity:.55;cursor:not-allowed}
.btn-primary{background:var(--rust);color:#fff}.btn-primary:hover:not([disabled]){background:var(--rust-hover)}
.btn-secondary{background:var(--surface);border-color:var(--line-strong)}.btn-secondary:hover:not([disabled]){border-color:var(--rust);color:var(--rust)}
.btn-ghost{color:var(--muted);padding:0 10px}.btn-ghost:hover{color:var(--rust)}
.btn-danger{background:var(--danger);color:#fff}.btn-danger:hover:not([disabled]){background:#951e17}
.btn-sm{min-height:38px;padding:0 14px;font-size:.85rem} .btn-block{width:100%}
.spin{width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.field label,.label{font-size:.88rem;font-weight:600}
.field .hint{font-size:.82rem;color:var(--muted)}
.input,.select{width:100%;min-height:46px;padding:10px 12px;background:var(--surface);border:1.5px solid var(--line-strong);border-radius:var(--r);transition:border-color .2s,box-shadow .2s}
.input:focus,.select:focus{outline:none;border-color:var(--rust);box-shadow:0 0 0 3px rgba(184,71,15,.12)}
.field.invalid .input{border-color:var(--danger)}
.err{font-size:.82rem;color:var(--danger)} .err:empty{display:none}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}
.pwd-wrap{position:relative}.pwd-wrap .input{padding-right:64px}
.pwd-toggle{position:absolute;right:6px;top:7px;height:32px;padding:0 10px;font-size:.82rem;font-weight:600;color:var(--muted)}
.code-input{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.14em;font-weight:600;font-size:1.1rem;text-transform:uppercase}
.notice{display:flex;gap:10px;padding:12px 14px;border-radius:var(--r);font-size:.9rem;margin-bottom:16px;border:1px solid}
.notice-error{background:var(--danger-soft);border-color:#f0c4bf;color:#7a1a14}
.notice-info{background:var(--sage-soft);border-color:#c8d9ce;color:#2f4a38}
#toasts{position:fixed;z-index:3000;top:16px;right:16px;display:flex;flex-direction:column;gap:10px;max-width:calc(100vw - 32px);pointer-events:none}
.toast{pointer-events:auto;background:var(--ink);color:#fff;padding:12px 16px;border-radius:var(--r);font-size:.9rem;box-shadow:0 10px 30px rgba(0,0,0,.2);border-left:4px solid var(--sage);animation:toastIn .25s ease;max-width:380px}
.toast.error{border-left-color:#e5675d}
@keyframes toastIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.modal-back{position:fixed;inset:0;z-index:2000;background:rgba(33,29,25,.55);display:flex;align-items:center;justify-content:center;padding:20px;animation:fade .2s ease}
.modal{background:var(--surface);border-radius:var(--r-lg);padding:28px;width:100%;max-width:440px;box-shadow:0 24px 60px rgba(0,0,0,.25)}
.modal h3{font-size:1.3rem;margin-bottom:10px} .modal p{color:var(--muted);margin-bottom:22px}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
@keyframes fade{from{opacity:0}to{opacity:1}}
.skel{background:linear-gradient(90deg,#eee7da 25%,#f6f1e7 37%,#eee7da 63%);background-size:400% 100%;animation:shimmer 1.4s ease infinite;border-radius:var(--r)}
@keyframes shimmer{0%{background-position:100% 50%}100%{background-position:0 50%}}

/* 3. FULL-SCREEN STATES */
.center-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.splash{flex-direction:column;gap:18px}
.splash .brand-word{font-family:var(--font-display);font-size:1.6rem;letter-spacing:.06em;font-weight:700}
.conn{max-width:480px;text-align:center}
.conn .mark{width:64px;height:64px;margin:0 auto 22px;border-radius:50%;background:var(--rust-soft);color:var(--rust);display:flex;align-items:center;justify-content:center}
.conn .mark svg{width:30px;height:30px}
.conn h1{font-size:1.8rem;margin-bottom:12px} .conn p{color:var(--muted);margin-bottom:26px}
.conn .detail{font-size:.82rem;color:var(--muted);margin-top:18px}
.auth{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);min-height:100vh}
.auth-art{background:var(--ink);color:#f4eee4;padding:56px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.auth-art::after{content:"";position:absolute;right:-120px;bottom:-120px;width:420px;height:420px;border:1px solid rgba(244,238,228,.14);border-radius:50%}
.auth-art .brand-word{font-family:var(--font-display);font-size:1.5rem;font-weight:700;letter-spacing:.08em}
.auth-art h2{font-size:clamp(2rem,3.2vw,2.9rem);max-width:460px;margin-bottom:16px}
.auth-art p{color:#c9bfb0;max-width:420px}
.auth-panel{display:flex;align-items:center;justify-content:center;padding:40px 24px}
.auth-card{width:100%;max-width:460px}
.auth-card h1{font-size:2rem;margin-bottom:6px} .auth-card .sub{color:var(--muted);margin-bottom:26px}
.auth-tabs{display:flex;gap:26px;border-bottom:1px solid var(--line);margin-bottom:26px}
.auth-tab{padding:12px 0;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.auth-tab.active{color:var(--text);border-color:var(--rust)}
.auth-links{display:flex;justify-content:space-between;margin-top:18px;font-size:.9rem}
.auth-links button{color:var(--rust);font-weight:600;min-height:40px}

/* 4. APP SHELL */
.side{position:fixed;inset:0 auto 0 0;width:var(--side);background:var(--ink);color:#e9e2d6;display:flex;flex-direction:column;padding:26px 14px 18px;z-index:50}
.side .brand-word{font-family:var(--font-display);font-size:1.3rem;font-weight:700;letter-spacing:.08em;padding:0 12px;margin-bottom:4px;color:#fff}
.side .portal{padding:0 12px;color:#a89f90;font-size:.85rem;margin-bottom:30px}
.nav{display:flex;flex-direction:column;gap:2px;flex:1}
.nav-link{display:flex;align-items:center;gap:12px;padding:12px;border-radius:var(--r);color:#cfc6b8;font-size:.94rem;font-weight:500;position:relative;transition:background .2s,color .2s}
.nav-link:hover{background:rgba(255,255,255,.06);color:#fff}
.nav-link.active{background:rgba(255,255,255,.09);color:#fff}
.nav-link.active::before{content:"";position:absolute;left:-14px;top:10px;bottom:10px;width:3px;background:var(--rust);border-radius:0 3px 3px 0}
.side-foot{border-top:1px solid rgba(255,255,255,.1);padding-top:16px;display:flex;flex-direction:column;gap:12px}
.who{padding:0 12px;min-width:0}
.who b{display:block;color:#fff;font-size:.93rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who span{color:#a89f90;font-size:.8rem;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.signout{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:var(--r);color:#cfc6b8;font-size:.92rem;width:100%}
.signout:hover{background:rgba(255,255,255,.06);color:#fff}
.main{margin-left:var(--side);min-height:100vh;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:40;background:rgba(250,247,242,.96);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 40px;min-height:64px}
.top h1{font-size:1.4rem}
.live{display:flex;align-items:center;gap:7px;font-size:.82rem;color:var(--muted);white-space:nowrap}
.live i{width:8px;height:8px;border-radius:50%;background:var(--line-strong)}
.live.on i{background:#2e9d5b;animation:pulseG 2.4s ease-in-out infinite}
#view{padding:36px 40px 80px;max-width:1120px;width:100%;margin:0 auto;outline:none}
.bottom{display:none}

/* 5. CONTENT PRIMITIVES */
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:28px;flex-wrap:wrap}
.page-head h2{font-size:clamp(1.6rem,3vw,2.3rem)} .page-head p{color:var(--muted);margin-top:6px}
.eyebrow{font-size:.9rem;color:var(--rust);font-weight:600;margin-bottom:6px}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:.9rem;font-weight:600;min-height:40px;margin-bottom:6px}
.back:hover{color:var(--rust)}
.section{margin-bottom:42px}
.section-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:16px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.section-head h3{font-size:1.2rem}
.section-head .tag{font-size:.82rem;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));border-top:1px solid var(--line-strong);border-bottom:1px solid var(--line-strong);margin-bottom:40px}
.stat{padding:20px 18px;border-right:1px solid var(--line)} .stat:last-child{border-right:0}
.stat .v{font-family:var(--font-display);font-size:2.3rem;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.stat .l{color:var(--muted);font-size:.9rem;margin-top:4px}
.split{display:grid;grid-template-columns:1.25fr 1fr;gap:44px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:22px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:18px}
.ecard{display:flex;flex-direction:column;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:22px;transition:border-color .2s}
.ecard:hover{border-color:var(--line-strong)}
.ecard h3{font-size:1.25rem}
.ecard .meta{color:var(--muted);font-size:.9rem}
.ecard .foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:auto}
.track{height:8px;background:#eee7da;border-radius:4px;overflow:hidden}
.fill{height:100%;background:var(--sage);border-radius:4px;transition:width .7s cubic-bezier(.2,.8,.2,1)}
.fill.rust{background:var(--rust)}
.prog-line{display:flex;justify-content:space-between;font-size:.88rem;margin-bottom:6px}
.bars{display:flex;flex-direction:column;gap:14px}
.bar-row .top-line{display:flex;justify-content:space-between;font-size:.93rem;margin-bottom:6px}
.bar-row b{font-variant-numeric:tabular-nums}
.rows{display:flex;flex-direction:column}
.qrow{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:.95rem}
.qrow:last-child{border-bottom:0} .qrow b{font-variant-numeric:tabular-nums}
.sub-h{font-weight:700;margin:0 0 4px;font-size:1rem}
.empty{text-align:center;padding:52px 24px;border:1.5px dashed var(--line-strong);border-radius:var(--r-lg)}
.empty h3{font-size:1.4rem;margin-bottom:8px}
.empty p{color:var(--muted);max-width:430px;margin:0 auto 22px}
.empty.small{padding:30px 20px}.empty.small h3{font-size:1.1rem}.empty.small p{margin-bottom:0}
.errblock{padding:20px;border:1px solid #f0c4bf;background:var(--danger-soft);border-radius:var(--r-lg);color:#7a1a14}
.errblock.unavail{background:var(--warn-soft);border-color:#ecd9a8;color:var(--warn)}
.errblock h4{font-size:1rem;margin-bottom:4px} .errblock p{font-size:.9rem;margin-bottom:12px}
.idbox{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:20px 22px;background:var(--ink);color:#fff;border-radius:var(--r-lg)}
.idbox .code{font-size:1.5rem;color:#fff}.idbox .muted{color:#b9afa0;font-size:.85rem}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.08em;font-weight:600}
.kv{display:grid;grid-template-columns:140px 1fr;gap:10px 18px;font-size:.95rem}
.kv dt{color:var(--muted)} .kv dd{overflow-wrap:anywhere}
.tline{list-style:none;border-left:2px solid var(--line-strong);margin-left:6px}
.tline li{padding:0 0 20px 22px;position:relative}
.tline li::before{content:"";position:absolute;left:-7px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--paper);border:2px solid var(--rust)}
.tline b{display:block}.tline span{color:var(--muted);font-size:.9rem}
.note-box{padding:16px 18px;background:var(--surface);border-left:3px solid var(--rust);border-radius:0 var(--r) var(--r) 0;white-space:pre-wrap;overflow-wrap:anywhere}
.chip{display:inline-block;padding:2px 9px;border-radius:5px;background:var(--sage-soft);color:#2f4a38;font-size:.82rem;font-weight:600}
.chip.warn{background:var(--warn-soft);color:var(--warn)}

/* Preparation status */
.status{display:inline-flex;align-items:center;gap:9px;font-weight:600;font-size:.95rem}
.status i{width:12px;height:12px;border-radius:50%;flex-shrink:0}
.status.notready{color:#b3261e}
.status.notready i{background:#e0281e;animation:blinkR 1.1s steps(2,start) infinite}
.status.ready{color:#1f7a45}
.status.ready i{background:#8fdcae;animation:pulseG 2.8s ease-in-out infinite}
@keyframes blinkR{to{opacity:.2}}
@keyframes pulseG{0%,100%{box-shadow:0 0 0 0 rgba(46,157,91,.4)}50%{box-shadow:0 0 0 7px rgba(46,157,91,0)}}
.prep{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:16px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.prep:last-child{border-bottom:0}
.prep .nm{font-weight:700;font-size:1.02rem;min-width:0;overflow-wrap:anywhere}
.prep .when{display:block;font-weight:400;color:var(--muted);font-size:.82rem}
.prep .ctl{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.prep.saving .status{opacity:.6}

/* Number selector wheel */
.dial-panel{display:flex;gap:28px;align-items:center;flex-wrap:wrap;padding:20px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);margin-bottom:26px}
.dial-copy{flex:1;min-width:220px}
.dial-copy h4{font-family:var(--font-display);font-size:1.1rem;margin-bottom:4px}
.dial-copy p{color:var(--muted);font-size:.9rem;margin-bottom:12px}
.dial-wrap{display:flex;flex-direction:column;align-items:center;gap:10px}
.dial{position:relative;width:244px;height:244px;border-radius:50%;border:1.5px solid var(--line-strong);background:radial-gradient(circle at 50% 50%,var(--paper) 0 34%,var(--surface) 35%);touch-action:manipulation;user-select:none;-webkit-user-select:none}
.dial::before{content:"";position:absolute;inset:34px;border-radius:50%;border:1px dashed var(--line-strong)}
.dial-needle{position:absolute;left:50%;top:50%;width:3px;height:68px;margin-left:-1.5px;background:var(--rust);border-radius:2px;transform-origin:50% 0;transition:transform .65s cubic-bezier(.3,.9,.25,1),opacity .3s}
.dial-needle.off{opacity:.18}
.dial-hub{position:absolute;left:50%;top:50%;width:70px;height:70px;margin:-35px 0 0 -35px;border-radius:50%;background:var(--ink);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:2;font-family:var(--font-display);font-weight:700;font-size:1.5rem;line-height:1}
.dial-hub small{font-family:var(--font-body);font-size:.62rem;font-weight:600;color:#c9bfb0;margin-top:3px;letter-spacing:.02em}
.dial-n{position:absolute;width:44px;height:44px;border-radius:50%;border:1.5px solid var(--line-strong);background:var(--surface);font-weight:700;font-size:1rem;display:flex;align-items:center;justify-content:center;z-index:3;transition:background .25s,color .25s,border-color .25s,transform .25s}
.dial-n:hover{border-color:var(--rust)}
.dial-n[aria-checked="true"]{background:var(--rust);border-color:var(--rust);color:#fff;transform:scale(1.08)}
.dial-n.c{font-family:ui-monospace,Menlo,monospace}
.dial-rot{display:flex;gap:10px}
.dial-custom{display:flex;gap:8px;align-items:center;margin-top:4px}
.dial-custom .input{width:130px}

/* 6. RESPONSIVE */
@media (max-width:1000px){.split{grid-template-columns:1fr;gap:36px}}
@media (max-width:900px){
  .side{display:none}
  .main{margin-left:0;padding-bottom:calc(var(--bottom) + env(safe-area-inset-bottom))}
  .top{padding:12px 16px;min-height:58px}.top h1{font-size:1.2rem}
  #view{padding:22px 16px 40px}
  .live span{display:none}
  .bottom{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--surface);border-top:1px solid var(--line-strong);padding:6px 6px calc(6px + env(safe-area-inset-bottom));height:calc(var(--bottom) + env(safe-area-inset-bottom))}
  .bn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:.74rem;font-weight:600;color:var(--muted);min-height:52px;border-radius:var(--r)}
  .bn.active{color:var(--rust)}
  .stats{grid-template-columns:1fr 1fr}
  .stat{border-bottom:1px solid var(--line);padding:16px 14px}.stat:nth-child(2n){border-right:0}
  .stat .v{font-size:1.9rem}
  .grid-2{grid-template-columns:1fr}
  .kv{grid-template-columns:1fr;gap:2px}.kv dd{margin-bottom:10px}
  .page-head .btn{width:100%}
  .cards{grid-template-columns:1fr}
  .prep .ctl{width:100%;justify-content:space-between}
  #toasts{top:auto;bottom:calc(var(--bottom) + 16px + env(safe-area-inset-bottom));left:16px;right:16px}
  .auth{grid-template-columns:1fr}.auth-art{display:none}
  .dial-panel{justify-content:center}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}.status.notready i{animation:none}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toasts" aria-live="polite"></div>
<div id="modalRoot"></div>
<script>
const api_url = "https://your-backend.onrender.com";

/* ==========================================================================
   NOWORRIES CATERER PORTAL
   --------------------------------------------------------------------------
   Reuses the Host Portal's established contract:
     GET  /health                      -> 2xx when alive
     GET  /api/config/firebase         -> public Firebase WEB config
   Protected calls send  Authorization: Bearer <Firebase ID token>.
   Errors: non-2xx JSON  { "message": "..." }.

   CATERER ENDPOINTS THIS PORTAL NEEDS (NOT yet established — the backend must
   implement them; nothing is mocked here, so each feature stays unavailable
   until its endpoint exists). Every one must verify the ID token, the
   server-assigned "caterer" role, and event membership. Wrong Event ID and
   wrong PIN must return the SAME generic 403/404 JSON message (no enumeration).

   POST   /api/auth/caterer/register {businessName,contactName,phone,email,password}
          -> 201 { catererId }  (server creates Firebase user, sets caterer role claim,
             generates permanent Caterer ID; client can never send a role)
   POST   /api/auth/caterer/forgot-password {email}
   GET    /api/caterer/me            -> { catererId, businessName, contactName, email, phone, role:"caterer" } (403 otherwise)
   PATCH  /api/caterer/me {businessName,contactName,phone} -> updated caterer
   GET    /api/caterer/events        -> { events:[{ id, brideName, groomName, weddingDate, venue,
                                                    categoryCount, readyCount }] }   (memberships only)

async function ensureEvents(force=false){

function teardownRealtime(){
  clearTimeout(state.rtTimer);
  if(state.rtRef && state.rtHandler){ try { state.rtRef.off('value', state.rtHandler); } catch {} }
  state.rtRef = null; state.rtHandler = null; state.rtPath = null; setLive(false, '');
}
function subscribeRealtime(path, eventId){
  if(path && state.rtPath === path && state.rtRef) return;   // already listening: never duplicate
  teardownRealtime();
  if(!path || !state.fb || !state.fb.db){ setLive(false, 'Live updates unavailable'); return; }
  try {
    const ref = state.fb.db.ref(path); let first = true;
    const handler = ref.on('value', () => {

      clearTimeout(state.rtTimer);
      state.rtTimer = setTimeout(() => { const r = parseHash(); if(r.name === 'event' && r.id === eventId) renderRoute(true); }, 400);
    }, () => setLive(false, 'Live updates unavailable'));
    state.rtRef = ref; state.rtHandler = handler; state.rtPath = path; setLive(true, 'Live');

}

const prepCats = () => (state.ws && state.ws.pr.status === 'fulfilled' && state.ws.pr.value && state.ws.pr.value.categories) || [];

/* Guest requirements (read-only). The quantity filter below only hides rows from this view. */

function countBlock(title, list, cls, min){

  }).join('') : '<p class="muted">The host has not configured meal categories, or guests have not selected any items yet.</p>';

/* --- Rotary number selector (1–8 + C). Operational filter only; never edits guest counts. --- */
const DIAL_ITEMS = [1,2,3,4,5,6,7,8,'C'];
const dialIndex = sel => sel === null ? -1 : DIAL_ITEMS.indexOf(sel);
function needleFor(sel){ const i = dialIndex(sel); return i < 0 ? null : i * 40 - 180; }   // needle points down at 0deg
function dialHtml(){
  const cx = 122, R = 92, d = state.dial;
  const btns = DIAL_ITEMS.map((v,i) => { const th = i*40*Math.PI/180, x = cx + R*Math.sin(th) - 22, y = cx - R*Math.cos(th) - 22;
    return `<button type="button" class="dial-n ${v==='C'?'c':''}" role="radio" aria-checked="${d.sel===v}" tabindex="${(d.sel===v || (d.sel===null && i===0))?0:-1}" data-dial="${v}" style="left:${x.toFixed(1)}px;top:${y.toFixed(1)}px" aria-label="${v==='C'?'Custom value':'At least '+v+' servings'}">${v}</button>`; }).join('');
  return `<div class="dial-wrap"><div class="dial" id="dial" role="radiogroup" aria-label="Minimum servings filter">${btns}<div class="dial-needle ${d.sel===null?'off':''}" id="dialNeedle" style="transform:rotate(${d.angle}deg)"></div><div class="dial-hub" id="dialHub" aria-live="polite">${dialHubHtml()}</div></div>
    <div class="dial-rot"><button class="btn btn-secondary btn-sm" data-action="dial-step" data-dir="-1" aria-label="Rotate dial to the previous value">${icon('left')}Back</button><button class="btn btn-secondary btn-sm" data-action="dial-step" data-dir="1" aria-label="Rotate dial to the next value">Next${icon('right')}</button></div>
    <div class="dial-custom ${d.sel==='C'?'':'hidden'}" id="dialCustom"><label class="sr" for="dialCustomInput">Custom minimum servings</label><input class="input" id="dialCustomInput" type="number" inputmode="numeric" min="1" max="100000" step="1" placeholder="e.g. 25" value="${d.min && d.sel==='C' ? d.min : ''}"><button class="btn btn-primary btn-sm" data-action="dial-apply">Apply</button></div></div>`;
}
const dialHubHtml = () => { const d = state.dial; return d.min ? `${esc(d.min)}<small>or more</small>` : d.sel === 'C' ? `C<small>enter value</small>` : `All<small>no filter</small>`; };
function dialSelect(v, focus){
  const d = state.dial; d.sel = v;
  if(v === null) d.min = null; else if(v !== 'C') d.min = v;
  const t = needleFor(v);
  if(t !== null){ let delta = (((t - d.angle) % 360) + 540) % 360 - 180; d.angle += delta; }   // shortest rotation
  const dial = $('#dial'); if(!dial) return;
  $$('.dial-n', dial).forEach(b => { const on = String(b.dataset.dial) === String(v); b.setAttribute('aria-checked', on); b.tabIndex = on || (v === null && b.dataset.dial === '1') ? 0 : -1; if(on && focus) b.focus(); });
  const n = $('#dialNeedle'); n.classList.toggle('off', v === null); n.style.transform = `rotate(${d.angle}deg)`;
  $('#dialHub').innerHTML = dialHubHtml();
  const c = $('#dialCustom'); c.classList.toggle('hidden', v !== 'C');
  if(v === 'C') { const i = $('#dialCustomInput'); i.value = d.min && !DIAL_ITEMS.includes(d.min) ? d.min : ''; if(focus !== false) i.focus(); }
  renderReq();
}
function dialStep(dir, focus){
  const i = dialIndex(state.dial.sel), n = DIAL_ITEMS.length;
  const next = i < 0 ? (dir > 0 ? 0 : n - 1) : (i + dir + n) % n;
  dialSelect(DIAL_ITEMS[next], focus);
}
function dialApply(){
  const input = $('#dialCustomInput'), v = Number(input.value);
  if(!Number.isInteger(v) || v < 1 || v > 100000){ toast('Enter a whole number between 1 and 100000.', 'error'); input.focus(); return; }
  state.dial.min = v;
  if(v <= 8) dialSelect(v, true); else { $('#dialHub').innerHTML = dialHubHtml(); renderReq(); }
}

function instructionsHtml(ev, rq){

  return `<div class="split"><div>

    <div><div class="sub-h" style="margin-bottom:12px">Event timeline</div>${tl}</div></div>`;

VIEWS.event = async (r) => {
  if(!r.id) return VIEWS.events();
  await loadWorkspace(r.id);
  const ev = state.ws.event;
  const html = `<div class="page-head"><div><a class="back" href="#/events">${icon('back')}All events</a><h2>${esc(coupleName(ev))}</h2><p>${esc(fmtDate(ev.weddingDate))}${ev.venue ? ' · ' + esc(ev.venue) : ''}</p></div>
      <button class="btn btn-secondary" data-action="leave-event">Leave event</button></div>
    <div id="wsStats">${wsStatsHtml()}</div>
    ${section('Preparation status', '<div id="prepBoard">' + prepHtml() + '</div>', 'Set by you · visible to the host')}
    ${section('Guest requirements', `<div class="dial-panel"><div class="dial-copy"><h4>Filter by quantity</h4><p>Turn the dial to show only rows with at least that many servings. This changes what you see on this screen only. Guest-submitted counts are never altered.</p><button class="btn btn-ghost btn-sm" data-action="dial-clear" style="padding-left:0">Show all rows</button></div>${dialHtml()}</div><div id="reqBody">${reqHtml()}</div>`, 'Submitted by guests · read only')}
    ${section('Host instructions and schedule', instructionsHtml(ev, state.ws.rq), 'Set by the host')}`;
  return { title: coupleName(ev), html };
};

/* ---------- 14. PROFILE ---------- */
VIEWS.profile = async () => {
  const c = state.caterer;
  return { title:'Profile', html: `<div class="page-head"><div><h2>Profile</h2><p>Your caterer account.</p></div></div>
    <div class="split"><div>${section('Account details', `<form data-form="profile" novalidate>
      ${fieldHtml({name:'businessName',label:'Caterer / business name',value:c.businessName,autocomplete:'organization',attrs:'maxlength="100"'})}
      ${fieldHtml({name:'contactName',label:'Contact person',value:c.contactName||'',autocomplete:'name',attrs:'maxlength="80"'})}
      ${fieldHtml({name:'phone',label:'Phone number',type:'tel',value:c.phone||'',autocomplete:'tel'})}
      <div class="field"><label>Email</label><input class="input" value="${esc(c.email)}" disabled><div class="hint">Your email is your sign-in identity and cannot be changed here.</div></div>
      <div class="err" data-for="_form" role="alert" style="margin-bottom:12px"></div><button class="btn btn-primary" type="submit">Save changes</button></form>`)}</div>
    <div>${section('Caterer ID', `<div class="idbox"><div><div class="muted">Permanent Caterer ID</div><div class="code">${esc(c.catererId)}</div></div><button class="btn btn-secondary btn-sm" data-action="copy" data-code="${esc(c.catererId)}">${icon('copy')}Copy</button></div>`)}
      ${section('Security', `<p class="muted" style="margin-bottom:14px">Send a password reset link to ${esc(c.email)}.</p><button class="btn btn-secondary" data-action="reset-pw">Email reset link</button>`)}
      ${section('Session', `<button class="btn btn-secondary" data-action="logout">${icon('logout')}Sign out</button>`)}</div></div>` };
};
forms.profile = async function(form){
  clearErrs(form);
  const businessName = form.businessName.value.trim(), contactName = form.contactName.value.trim(), phone = form.phone.value.trim(); let bad = false;
  if(businessName.length < 2){ setErr(form,'businessName','Enter your business name.'); bad = true; }
  if(contactName.length < 2){ setErr(form,'contactName','Enter the contact person’s name.'); bad = true; }
  if(!validPhone(phone)){ setErr(form,'phone','Enter a valid phone number.'); bad = true; }
  if(bad) return;
  const btn = $('button[type=submit]', form); setBusy(btn, true, 'Saving');
  try {
    const d = await api('/api/caterer/me', { method:'PATCH', body:{ businessName, contactName, phone } });
    const c = d && (d.caterer || d);
    if(!c || c.role !== 'caterer') throw new ApiError('server', 'The server did not confirm the update.');
    state.caterer = c; toast('Profile updated'); const w = $('#whoName'); if(w) w.textContent = c.businessName;
  } catch(e){ setErr(form,'_form', errorText(e)); } finally { setBusy(btn, false); }
};

/* ---------- 15. ACTIONS ---------- */
async function setStatus(el){
  const ws = state.ws; if(!ws) return;
  const id = ws.id, key = el.dataset.key, to = el.dataset.to, label = el.dataset.label, bk = id + ':' + key;
  if(state.busy.has(bk)) return;
  const ok = await confirmDialog({ title: to === 'ready' ? `Mark “${label}” as Ready?` : `Mark “${label}” as Not Ready?`,
    message: to === 'ready' ? 'The host will see this category as Ready as soon as it is saved.' : 'The host will see this category as Not Ready again.', confirmText: to === 'ready' ? 'Mark Ready' : 'Mark Not Ready' });
  if(!ok || !state.ws || state.ws.id !== id) return;
  state.busy.add(bk); renderPrep();
  try {
    const d = await api(evUrl(id, '/preparation/' + enc(key)), { method:'PUT', body:{ status: to } });
    const c = d && (d.category || d);
    if(!c || c.status !== to) throw new ApiError('server', 'The server did not confirm the change.');
    const cat = prepCats().find(x => x.key === key);
    if(state.ws && state.ws.id === id && cat){ cat.status = c.status; if(c.updatedAt) cat.updatedAt = c.updatedAt; }
    state.events = null; toast(`“${label}” saved as ${to === 'ready' ? 'Ready' : 'Not Ready'}.`);
  } catch(e){
    if(e.kind !== 'unauthenticated') toast(`Could not save “${label}”: ${errorText(e)} The last saved status is still shown.`, 'error');
  } finally { state.busy.delete(bk); if(state.ws && state.ws.id === id) renderPrep(); }
}
const actions = {
  'retry': () => renderRoute(),
  'retry-connection': () => boot(),
  'logout': () => logout(),
  'goto-login': () => { state.authNotice = null; renderAuth('login'); },
  'auth-mode': el => { state.authNotice = null; renderAuth(el.dataset.mode); },
  'toggle-pwd': el => { const i = el.parentElement.querySelector('input'); const show = i.type === 'password'; i.type = show ? 'text' : 'password'; el.textContent = show ? 'Hide' : 'Show'; },
  'copy': el => copyText(el.dataset.code),
  'set-status': el => setStatus(el),
  'dial-step': el => dialStep(+el.dataset.dir, false),
  'dial-apply': () => dialApply(),
  'dial-clear': () => dialSelect(null),
  'leave-event': async () => {
    const ws = state.ws; if(!ws) return;
    const ok = await confirmDialog({ title:'Leave this event?', message:`You will lose access to ${coupleName(ws.event)} and its preparation board. You can only rejoin with the Event ID and PIN.`, confirmText:'Leave event', danger:true });
    if(!ok) return;
    try { await api(evUrl(ws.id, '/membership'), { method:'DELETE' }); teardownRealtime(); state.ws = null; state.events = null; toast('You have left the event.'); location.hash = '#/events'; }
    catch(e){ if(e.kind !== 'unauthenticated') toast(e.kind === 'unavailable' ? 'Leaving events is not available on the server yet.' : errorText(e), 'error'); }
  },
  'reset-pw': async el => {
    setBusy(el, true, 'Sending');
    try { await api('/api/auth/caterer/forgot-password', { method:'POST', auth:false, body:{ email: state.caterer.email } }); toast('Reset link requested. Check your inbox.'); }
    catch(e){ toast(errorText(e), 'error'); } finally { setBusy(el, false); }
  }
};
document.addEventListener('click', e => {
  const dn = e.target.closest('[data-dial]');
  if(dn){ dialSelect(dn.dataset.dial === 'C' ? 'C' : Number(dn.dataset.dial), true); return; }
  const el = e.target.closest('[data-action]'); if(!el) return;
  const fn = actions[el.dataset.action]; if(fn){ if(el.tagName === 'BUTTON') e.preventDefault(); fn(el, e); }
});
document.addEventListener('submit', e => { const f = e.target.closest('[data-form]'); if(!f) return; e.preventDefault(); const fn = forms[f.dataset.form]; if(fn) fn(f); });
document.addEventListener('input', e => {
  const t = e.target;
  if(t.matches('[data-eventid]')) t.value = fmtCode(normCode(t.value));
  else if(t.id === 'f-pin') t.value = t.value.replace(/\D/g,'').slice(0,4);
});
document.addEventListener('keydown', e => {
  if(e.key === 'Escape'){ const m = $('#modalRoot .modal-back:last-child'); if(m) m.remove(); return; }
  if(e.target.closest && e.target.closest('#dial') && e.target.matches('.dial-n')){
    const k = e.key; if(['ArrowRight','ArrowDown','ArrowLeft','ArrowUp'].includes(k)){ e.preventDefault(); dialStep(k === 'ArrowRight' || k === 'ArrowDown' ? 1 : -1, true); }
  }
  if(e.key === 'Enter' && e.target.id === 'dialCustomInput'){ e.preventDefault(); dialApply(); }
});

/* ---------- 16. START ---------- */
boot();
})();
</script>

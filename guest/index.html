<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#2f4a3e">
<title>NOWORRIES · Guest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f5efe4;--paper2:#ece3d2;--card:#fbf8f1;--ink:#241f1a;--muted:#675e52;--line:#d6c9b2;
  --brick:#8a3a2f;--brick-d:#702d24;--brass:#a9823f;--pine:#2f4a3e;--pine-d:#223830;--ok:#2f6b4a;--err:#a3281f;
  --serif:"Cormorant Garamond",Georgia,"Times New Roman",serif;--sans:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{font:16px/1.5 var(--sans);color:var(--ink);background:var(--paper);min-height:100dvh;overflow-x:hidden}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{font-family:var(--serif);font-weight:600;line-height:1.1}
h1{font-size:clamp(2.2rem,7vw,3.4rem)}h2{font-size:clamp(1.7rem,5vw,2.3rem)}h3{font-size:1.35rem}
p{max-width:62ch}
a{color:var(--brick)}
:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
.muted{color:var(--muted)}.small{font-size:.9rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;min-height:48px;padding:0 1.4rem;border:1.5px solid var(--brick);background:var(--brick);color:#fff8ef;border-radius:6px;font-weight:600;transition:background .2s,transform .1s}
.btn:hover{background:var(--brick-d)}.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;color:var(--brick)}.btn.ghost:hover{background:rgba(138,58,47,.08)}
.btn.light{background:var(--paper);border-color:var(--paper);color:var(--pine-d)}.btn.light:hover{background:#fff}
.btn.lghost{background:transparent;border-color:rgba(245,239,228,.5);color:var(--paper)}
.btn:disabled,.btn[aria-disabled=true]{opacity:.5;pointer-events:none}
.link{background:none;border:0;color:var(--brick);text-decoration:underline;padding:.4rem 0;min-height:44px}
.row{display:flex;gap:.75rem;flex-wrap:wrap;align-items:center}
.stack>*+*{margin-top:1rem}
/* forms */
.field{display:grid;gap:.35rem}
.field label{font-weight:600;font-size:.95rem}
.field input,.field textarea{min-height:50px;padding:.7rem .9rem;border:1.5px solid var(--line);background:#fffdf8;border-radius:6px;width:100%}
.field textarea{min-height:90px;resize:vertical}
.field input:focus,.field textarea:focus{border-color:var(--pine);outline:none;box-shadow:0 0 0 3px rgba(47,74,62,.18)}
.field .err{color:var(--err);font-size:.9rem;min-height:1.1em}
.field input[aria-invalid=true]{border-color:var(--err)}
.alert{padding:.8rem 1rem;border-left:4px solid var(--brass);background:var(--paper2);border-radius:0 6px 6px 0}
.alert.bad{border-color:var(--err);background:#f6e1dd}.alert.good{border-color:var(--ok);background:#e0eee4}
/* auth */
.auth{min-height:100dvh;display:grid;grid-template-columns:1fr}
.auth-hero{background:var(--pine);color:var(--paper);padding:2.5rem 1.5rem 2rem;display:flex;flex-direction:column;justify-content:flex-end;gap:1rem;min-height:220px}
.auth-hero .brand{font-family:var(--serif);font-size:1.5rem;letter-spacing:.12em}
.auth-hero p{color:#d9d2c0}
.auth-main{padding:1.5rem 1.25rem 3rem;max-width:520px;width:100%;margin:0 auto}
.tabs{display:flex;border-bottom:1.5px solid var(--line);margin-bottom:1.5rem}
.tabs button{flex:1;min-height:50px;background:none;border:0;border-bottom:3px solid transparent;margin-bottom:-1.5px;font-weight:600;color:var(--muted)}
.tabs button[aria-selected=true]{color:var(--ink);border-color:var(--brick)}
@media(min-width:860px){.auth{grid-template-columns:1fr 1fr}.auth-hero{padding:4rem;justify-content:space-between}.auth-main{align-self:center;padding:3rem}}
/* shell */
.shell{min-height:100dvh;padding-bottom:84px}
.page{max-width:900px;margin:0 auto;padding:1.5rem 1.25rem 2rem}
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1.5px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:20}
.nav a{flex:1;min-height:64px;display:grid;place-items:center;text-decoration:none;color:var(--muted);font-weight:600;border-top:3px solid transparent;margin-top:-1.5px}
.nav a[aria-current=page]{color:var(--brick);border-color:var(--brick)}
.topbar{display:none}
@media(min-width:860px){
  .shell{padding-bottom:0}
  .nav{position:sticky;top:0;bottom:auto;border:0;border-bottom:1.5px solid var(--line);padding:0 2rem;justify-content:flex-start;gap:.5rem}
  .nav a{flex:none;min-height:60px;padding:0 1.2rem;border-top:0;border-bottom:3px solid transparent;margin:0 0 -1.5px}
  .nav a[aria-current=page]{border-bottom-color:var(--brick)}
  .nav .spacer{flex:1}
  .nav a.profile{order:3}
}
.hello{padding:1rem 0 1.5rem;border-bottom:1.5px solid var(--line);margin-bottom:1.5rem}
.hello .gid{font-family:ui-monospace,Menlo,monospace;background:var(--paper2);padding:.15rem .5rem;border-radius:4px;font-size:.95rem;word-break:break-all}
.ev{display:grid;grid-template-columns:110px 1fr;gap:1rem;width:100%;text-align:left;padding:0;background:var(--card);border:1.5px solid var(--line);border-radius:8px;overflow:hidden;transition:border-color .2s,transform .2s}
.ev:hover{border-color:var(--brass);transform:translateY(-2px)}
.ev .ph{background:var(--pine);color:var(--paper);display:grid;place-items:center;font-family:var(--serif);font-size:2rem;min-height:130px;background-size:cover;background-position:center}
.ev .body{padding:1rem 1rem 1rem 0;display:grid;gap:.25rem;align-content:center}
.ev h3{font-size:1.5rem}
.status{font-weight:600;font-size:.95rem}.status.ok{color:var(--ok)}.status.wait{color:var(--brick)}
.ev.next{grid-template-columns:1fr}.ev.next .ph{min-height:190px}.ev.next .body{padding:1rem 1.25rem 1.25rem}
@media(min-width:700px){.ev.next{grid-template-columns:260px 1fr}.ev.next .body{padding:1.25rem 1.5rem 1.25rem 0}}
.list{display:grid;gap:1rem}
.skel{background:linear-gradient(90deg,var(--paper2),#f3ecdd,var(--paper2));background-size:200% 100%;animation:sh 1.4s infinite;border-radius:8px;min-height:120px}
@keyframes sh{to{background-position:-200% 0}}
.center{min-height:100dvh;display:grid;place-items:center;padding:2rem;text-align:center}
.center .box{max-width:440px;display:grid;gap:1rem;justify-items:center}
.spin{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--brick);border-radius:50%;animation:rot .9s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
dl.kv{display:grid;grid-template-columns:max-content 1fr;gap:.6rem 1.25rem}dl.kv dt{color:var(--muted)}dl.kv dd{font-weight:500;word-break:break-word}
/* story */
.story{min-height:100dvh;background:var(--pine-d);color:var(--paper);display:flex;flex-direction:column;position:relative}
.story .top{display:flex;justify-content:space-between;align-items:center;padding:.75rem 1rem}
.story .top button{color:var(--paper)}
.story .stage{flex:1;display:grid;align-content:center;justify-items:center;text-align:center;padding:1.5rem 1.5rem 7rem;gap:1.25rem;animation:rise .7s cubic-bezier(.2,.7,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.story .stage p{color:#e6dfcd;margin-inline:auto}
.story .kicker{font-family:var(--serif);font-style:italic;font-size:1.3rem;color:#d4b878}
.story .controls{position:fixed;left:0;right:0;bottom:0;padding:1rem 1rem calc(1rem + env(safe-area-inset-bottom));display:grid;gap:.9rem;background:linear-gradient(transparent,var(--pine-d) 40%)}
.story .controls .btns{display:flex;gap:.75rem;justify-content:center}
.segs{display:flex;gap:4px;max-width:420px;margin:0 auto;width:100%}
.segs i{flex:1;height:3px;background:rgba(245,239,228,.25);border-radius:2px}.segs i.on{background:#d4b878}
.couple{display:flex;gap:1rem;align-items:flex-start;justify-content:center}
.couple figure{width:min(40vw,210px)}
.frame{aspect-ratio:3/4;background:#3a5a4c;border:1.5px solid #d4b878;border-radius:110px 110px 6px 6px;overflow:hidden;display:grid;place-items:center;font-family:var(--serif);font-size:3.5rem;color:#d4b878}
.frame img{width:100%;height:100%;object-fit:cover}
.couple figcaption{font-family:var(--serif);font-size:1.7rem;margin-top:.6rem}
.amp{font-family:var(--serif);font-style:italic;font-size:2.6rem;color:#d4b878;align-self:center;padding-top:2rem}
.quote{font-family:var(--serif);font-size:clamp(1.5rem,4.5vw,2.2rem);line-height:1.35;font-style:italic;max-width:32ch;white-space:pre-wrap}
.facts{display:grid;gap:1.1rem;text-align:left;width:min(100%,520px)}
.facts div{border-bottom:1px solid rgba(212,184,120,.35);padding-bottom:.8rem}
.facts dt{color:#d4b878;font-family:var(--serif);font-style:italic;font-size:1.15rem}.facts dd{font-size:1.15rem}
.tl{list-style:none;padding:0;text-align:left;width:min(100%,520px);border-left:1.5px solid #d4b878;margin-left:.5rem}
.tl li{padding:0 0 1.3rem 1.4rem;position:relative}
.tl li::before{content:"";position:absolute;left:-6px;top:.45rem;width:11px;height:11px;border-radius:50%;background:#d4b878}
.tl .when{color:#d4b878;font-size:.95rem}.tl b{font-family:var(--serif);font-size:1.4rem;font-weight:600;display:block}
/* rsvp */
.rsvp{max-width:760px;margin:0 auto;padding:1rem 1.25rem 7rem}
.rhead{display:flex;align-items:center;gap:1rem;justify-content:space-between;margin-bottom:1.25rem}
.bar{height:4px;background:var(--paper2);border-radius:2px;margin-bottom:1.75rem}.bar i{display:block;height:100%;background:var(--brick);border-radius:2px;transition:width .4s}
.foot{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1.5px solid var(--line);padding:.8rem 1rem calc(.8rem + env(safe-area-inset-bottom));display:flex;gap:.75rem;justify-content:center;z-index:15}
.foot .btn{flex:1;max-width:260px}
/* dial */
.dialwrap{display:grid;justify-items:center;gap:.75rem}
.dial{--d:min(84vw,330px);width:var(--d);height:var(--d);position:relative;border-radius:50%;background:radial-gradient(circle at 50% 45%,#fffdf8 0 38%,var(--paper2) 39% 100%);border:2px solid var(--brass);box-shadow:inset 0 0 0 7px var(--paper),inset 0 0 0 8px var(--line),0 10px 26px rgba(36,31,26,.12)}
.dial .n{position:absolute;width:16%;height:16%;transform:translate(-50%,-50%);border-radius:50%;border:1.5px solid var(--line);background:var(--card);font-family:var(--serif);font-size:calc(var(--d)*.085);font-weight:600;display:grid;place-items:center;z-index:2;transition:color .3s,opacity .3s,filter .3s}
.dial .n[aria-checked=true]{color:#fff8ef;border-color:transparent}
.dial .n[aria-disabled=true]{opacity:.35;filter:blur(1.4px);cursor:not-allowed}
.dial .ptr{position:absolute;width:16%;height:16%;transform:translate(-50%,-50%);border-radius:50%;background:var(--brick);z-index:1;transition:left .55s cubic-bezier(.3,1.35,.5,1),top .55s cubic-bezier(.3,1.35,.5,1);box-shadow:0 3px 8px rgba(138,58,47,.4)}
.dial .stop{position:absolute;width:9%;height:3.2%;background:var(--brass);border-radius:3px;transform:translate(-50%,-50%) rotate(var(--r))}
.dial .mid{position:absolute;inset:30%;border-radius:50%;display:grid;place-items:center;text-align:center;align-content:center;line-height:1.05}
.dial .mid b{font-family:var(--serif);font-size:calc(var(--d)*.2);font-weight:600}
.dial .mid span{font-size:.85rem;color:var(--muted)}
.cust{display:flex;gap:.5rem;align-items:flex-start}
.cust input{width:110px;min-height:48px;padding:0 .8rem;border:1.5px solid var(--line);border-radius:6px;background:#fffdf8}
.cust .err{color:var(--err);font-size:.9rem;flex-basis:100%}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{min-height:50px;min-width:96px;padding:0 1.2rem;background:var(--card);border:0;font-weight:600}
.seg button+button{border-left:1.5px solid var(--line)}
.seg button[aria-pressed=true]{background:var(--pine);color:var(--paper)}
.alloc{border-top:1.5px solid var(--line)}
.alloc .it{display:grid;grid-template-columns:1fr auto;gap:.25rem 1rem;align-items:center;padding:1rem 0;border-bottom:1.5px solid var(--line)}
.alloc .it p{grid-column:1/-1;font-size:.92rem;color:var(--muted)}
.alloc .cnt{min-width:64px;min-height:48px;border:1.5px solid var(--line);border-radius:6px;background:var(--card);font-family:var(--serif);font-size:1.5rem;font-weight:600}
.alloc .cnt:disabled{background:var(--paper2);color:var(--muted)}
.rem{position:sticky;top:0;background:var(--paper);padding:.7rem 0;border-bottom:1.5px solid var(--line);z-index:5;display:flex;justify-content:space-between;gap:1rem;font-weight:600}
.sum{display:grid;gap:1.25rem}
.sum section{border-top:1.5px solid var(--line);padding-top:.9rem}
.sum h3{margin-bottom:.4rem}
.sum ul{list-style:none;padding:0}.sum li{display:flex;justify-content:space-between;gap:1rem;padding:.2rem 0}
dialog{border:0;border-radius:10px;padding:0;background:var(--card);color:var(--ink);max-width:min(92vw,440px);width:100%;box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(25,22,18,.6)}
dialog .in{padding:1.4rem;display:grid;gap:1rem;justify-items:center}
dialog .in>*{max-width:100%}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:#fff8ef;padding:.8rem 1.2rem;border-radius:6px;z-index:60;max-width:90vw;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.toast.bad{background:var(--err)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div id="live" class="sr" aria-live="polite" style="position:absolute;left:-9999px"></div>

<script type="module">
const api_url = "https://noworries-backend-70ij.onrender.com";

/* ---------- tiny DOM helpers (textContent only -> no XSS) ---------- */
function h(tag, props, ...kids){
  const el = document.createElement(tag);
  for(const [k,v] of Object.entries(props||{})){
    if(v==null||v===false) continue;
    if(k==='class') el.className=v;
    else if(k.startsWith('on')) el.addEventListener(k.slice(2),v);
    else if(k==='text') el.textContent=v;
    else if(k==='for') el.setAttribute('for',v);
    else if(k in el && !k.startsWith('aria') && k!=='role' && k!=='list'){ try{el[k]=v}catch{el.setAttribute(k,v)} }
    else el.setAttribute(k,v===true?'':v);
  }
  for(const kid of kids.flat(Infinity)){ if(kid==null||kid===false) continue; el.append(kid.nodeType?kid:document.createTextNode(String(kid))); }
  return el;
}
const root = document.getElementById('app');
const safeUrl = u => { try{ const x=new URL(u); return x.protocol==='https:'?x.href:''; }catch{ return ''; } };
const announce = t => { document.getElementById('live').textContent=t; };
function toast(msg,bad){ const t=h('div',{class:'toast'+(bad?' bad':''),role:'status'},msg); document.body.append(t); setTimeout(()=>t.remove(),4200); }

/* ---------- API layer ---------- */
class ApiError extends Error{ constructor(kind,status,message,data){ super(message); this.kind=kind; this.status=status; this.data=data; } }
let fb = {};                // firebase handles
async function api(path,{method='GET',body,auth=true,timeout=15000,retry=true}={}){
  const headers={'Accept':'application/json'};
  if(body!==undefined) headers['Content-Type']='application/json';
  if(auth){
    const u=fb.auth&&fb.auth.currentUser;
    if(!u) throw new ApiError('auth',401,'Please log in again.');
    try{ headers.Authorization='Bearer '+await u.getIdToken(); }catch{ throw new ApiError('network',0,'Could not refresh your session.'); }
  }
  const ctl=new AbortController(); const timer=setTimeout(()=>ctl.abort(),timeout);
  let res;
  try{ res=await fetch(api_url.replace(/\/$/,'')+path,{method,headers,body:body!==undefined?JSON.stringify(body):undefined,signal:ctl.signal,cache:'no-store'}); }
  catch(e){ throw new ApiError(e.name==='AbortError'?'timeout':'network',0,e.name==='AbortError'?'The server took too long to respond.':'Unable to reach the server.'); }
  finally{ clearTimeout(timer); }
  let data=null; try{ data=await res.json(); }catch{}
  if(res.ok) return data;
  const msg=(data&&(data.error||data.message))||'Something went wrong.';
  if(res.status===401){
    if(auth&&retry&&fb.auth.currentUser){ try{ await fb.auth.currentUser.getIdToken(true); return api(path,{method,body,auth,timeout,retry:false}); }catch{} }
    throw new ApiError('auth',401,'Your session has expired. Please log in again.',data);
  }
  if(res.status===403) throw new ApiError('forbidden',403,msg,data);
  if(res.status===404 && !(data&&(data.error||data.message))) throw new ApiError('missing',404,'This feature is not available on the server yet ('+path+').',data);
  if(res.status===404) throw new ApiError('notfound',404,msg,data);
  if(res.status>=500) throw new ApiError('server',res.status,'The server had a problem. Please try again shortly.',data);
  throw new ApiError('client',res.status,msg,data);
}

/* ---------- state ---------- */
const S = { view:'boot', guest:null, events:null, ev:null, authMsg:null, authTab:'login', busy:false, err:null };
let seq=0, pollTimer=null;

/* ---------- formatting ---------- */
function fmtDate(s,tz,withTime){
  if(!s) return '';
  try{
    if(/^\d{4}-\d{2}-\d{2}$/.test(s)){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d).toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long',year:'numeric'}); }
    const o={weekday:'long',day:'numeric',month:'long',year:'numeric'}; if(withTime){o.hour='numeric';o.minute='2-digit';o.timeZoneName='short';} if(tz) o.timeZone=tz;
    return new Date(s).toLocaleString(undefined,o);
  }catch{ return String(s); }
}
const initials = n => (String(n||'?').trim()[0]||'?').toUpperCase();
const sum = o => Object.values(o||{}).reduce((a,b)=>a+(+b||0),0);

/* ---------- boot ---------- */
async function boot(){
  S.view='boot'; render();
  try{ await api('/health',{auth:false,timeout:8000}); }
  catch(e){ S.err=e; S.view='offline'; return render(); }
  try{
    if(!fb.auth){
      const cfg=await api('/api/public/firebase-config',{auth:false});
      const [{initializeApp},A]=await Promise.all([import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js'),import('https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js')]);
      const app=initializeApp(cfg.config||cfg); fb.A=A; fb.auth=A.getAuth(app);
      await A.setPersistence(fb.auth,A.browserLocalPersistence);
      A.onAuthStateChanged(fb.auth,handleUser);   // fires once with the restored session (or null)
    } else handleUser(fb.auth.currentUser);
  }catch(e){ S.err=e.kind?e:new ApiError('network',0,'Unable to load authentication.'); S.view='offline'; render(); }
}
async function handleUser(user){
  const my=++seq;
  if(!user){ stopPoll(); S.guest=null; S.events=null; S.ev=null; S.view='auth'; return render(); }
  S.view='restoring'; render();
  try{
    const [me,evs]=await Promise.all([api('/api/guest/me'),api('/api/guest/events')]);
    if(my!==seq) return;
    S.guest=me.guest; S.events=evs.events||[];
    S.view='app'; route();
  }catch(e){
    if(my!==seq) return;
    if(e.kind==='auth'||e.kind==='forbidden'){
      S.authMsg=e.kind==='forbidden'?'This portal is for guest accounts only. Please use the Host or Caterer portal for those accounts.':e.message;
      await fb.A.signOut(fb.auth);
    } else { S.err=e; S.view='offline'; render(); }
  }
}
async function logout(){ stopPoll(); await fb.A.signOut(fb.auth); S.guest=null; S.events=null; S.ev=null; S.authMsg=null; location.hash=''; }

/* ---------- routing (hash; contains no secrets) ---------- */
addEventListener('hashchange',()=>{ if(S.view==='app') route(); });
function route(){
  const hash=location.hash.replace(/^#\/?/,'');
  const [page,id]=hash.split('/');
  S.page=['home','join','profile','event'].includes(page)?page:'home';
  if(S.page!=='event'){ stopPoll(); S.ev=null; }
  if(S.page==='event'&&id){ if(!S.ev||S.ev.id!==decodeURIComponent(id)) openEvent(decodeURIComponent(id)); }
  else if(S.page==='event'){ location.hash='#/home'; return; }
  if(S.page==='home') refreshEvents();
  render();
}
async function refreshEvents(){ try{ const r=await api('/api/guest/events'); S.events=r.events||[]; if(S.page==='home') render(); }catch(e){ if(e.kind==='auth') handleUser(null); } }

/* ---------- views ---------- */
function render(){
  root.replaceChildren();
  const sy=window.scrollY;
  switch(S.view){
    case 'boot': root.append(loading('Connecting to NOWORRIES…')); break;
    case 'restoring': root.append(loading('Restoring your session…')); break;
    case 'offline': root.append(offlineView()); break;
    case 'auth': root.append(authView()); break;

function dialValues(){ return [1,2,3,4,5,6,7,8,'C']; }

/* ---------- RSVP wizard ---------- */

  const d=S.ev.data, diet=d.diet||{}, s=['attendance'];
  if((diet.categories||[]).length) s.push('dining'); if((diet.meals||[]).some(m=>(m.options||[]).length)) s.push('meals'); if((diet.allergies||[]).length) s.push('allergy');
  s.push('stay','review'); return s;
}
function startWizard(){ S.ev.mode='wizard'; S.ev.step=S.ev.sub?1:0; S.ev.err=null; render(); }

  const dr=S.ev.draft, a=dr.attendance||0; let total=sum(dr.diet), trimmed=false;
  if(total>a){ dr.diet={}; trimmed=true; }

  if(dr.acc.count>a){ dr.acc.count=a; trimmed=true; }

}

        :makeDial({id:'att',label:'Number attending',values:dialValues(),value:dr.attendance,max,unit:'attending',center:'attending',onPick:v=>{ dr.attendance=v; clampDraft(); redraw(); }})];

          (c.description||DESC[String(c.key).toLowerCase()])&&h('p',{},c.description||DESC[String(c.key).toLowerCase()])); })),
      kitchenNote(false)];
    canNext=true;
  } else if(key==='meals'){
    body=[h('h2',{},'Meal preferences'),h('p',{class:'muted'},'These are independent of your main course. Someone can appear in several, but never more than '+att+' in one.'),lockFood&&lockNote('Food preferences are locked and can no longer be changed.'),
      d.diet.meals.filter(s=>(s.options||[]).length).map(s=>h('section',{style:'margin-top:1.5rem'},h('h3',{},s.label),h('div',{class:'alloc'},s.options.map(o=>{ const cur=+dr.meals[o.key]||0;
        return h('div',{class:'it'},h('span',{},o.label),h('button',{class:'cnt',disabled:lockFood,'aria-label':o.label+', '+cur+' selected. Change',onclick:()=>countSheet({id:'m-'+o.key,title:o.label,max:att,value:cur,unit:'guests',onDone:v=>{ if(v) dr.meals[o.key]=v; else delete dr.meals[o.key]; redraw(); }})},String(cur))); }))))];
  } else if(key==='allergy'){
    body=[h('h2',{},'Allergies and intolerances'),h('p',{class:'muted'},'Tell the kitchen how many guests are affected.'),lockFood&&lockNote('Food preferences are locked and can no longer be changed.'),
      h('div',{class:'alloc'},d.diet.allergies.map(a=>{ const cur=+dr.allergies[a.key]||0;
        return h('div',{class:'it'},h('span',{},a.label),h('button',{class:'cnt',disabled:lockFood,'aria-label':a.label+', '+cur+' affected. Change',onclick:()=>countSheet({id:'a-'+a.key,title:a.label,max:att,value:cur,unit:'guests',onDone:v=>{ if(v) dr.allergies[a.key]=v; else delete dr.allergies[a.key]; redraw(); }})},String(cur))); })),
      h('div',{class:'field',style:'margin-top:1rem'},h('label',{for:'an'},'Anything else the kitchen should know? (optional)'),h('textarea',{id:'an',maxlength:'300',disabled:lockFood,value:dr.allergyNotes,oninput:e=>{ dr.allergyNotes=e.target.value; }})),
      kitchenNote(true)];
  } else if(key==='stay'){
    const info=d.accommodation&&d.accommodation.instructions;
    body=[h('h2',{},'Does your family require accommodation?'),
      info?h('div',{class:'alert',style:'white-space:pre-wrap'},info):h('p',{class:'muted'},'The hosts haven’t shared accommodation details yet.'),
      lockStay&&lockNote('Accommodation can no longer be changed for this wedding.'),
      h('div',{class:'seg',role:'group','aria-label':'Accommodation required'},
        h('button',{type:'button',disabled:lockStay,'aria-pressed':String(dr.acc.required===true),onclick:()=>{ dr.acc.required=true; if(!dr.acc.count) dr.acc.count=att; redraw(); }},'Yes'),

      dr.acc.required&&(lockStay?h('p',{},h('b',{},dr.acc.count),' people need accommodation.'):h('div',{style:'margin-top:1rem'},h('p',{class:'muted',style:'margin-bottom:.5rem'},'How many need a room? Up to '+att+'.'),
        makeDial({id:'acc',label:'People needing accommodation',values:dialValues(),value:dr.acc.count||null,max:att,unit:'people',center:'need rooms',onPick:v=>{ dr.acc.count=v; redraw(); }})))];

    h('div',{class:'bar'},h('i',{style:'width:'+((ev.step+1)/steps.length*100)+'%'})),body),footer);
}
function kitchenNote(allergy){
  const k=(S.ev.data.diet||{}).kitchen||{};
  return h('div',{class:'alert',style:'margin-top:1.25rem'},
    allergy?'Listing an allergy or intolerance does not guarantee the kitchen can accommodate it. ':'Dish availability depends on your hosts’ caterer. ',
    k.strictVegetarianSeparation?'The hosts have arranged separate preparation for vegetarian food. ':'',
    k.allergenSafePreparation?'The hosts have arranged allergen-aware preparation. ':(allergy?'For serious allergies, please speak with your hosts directly.':''));
}
function leaveWizard(){
  const go=()=>{ S.ev.draft=draftFrom(S.ev.sub); S.ev.base=JSON.stringify(S.ev.draft); S.ev.mode='story'; S.ev.chapter=chapters().length-1; render(); };
  if(dirtyFn()) confirmBox('Discard your changes?','Nothing has been saved yet.','Discard',go); else go();
}
function validate(){
  const ev=S.ev,d=ev.data,dr=ev.draft,max=(d.limits&&d.limits.maxAttendance)||30,a=dr.attendance;
  if(!Number.isInteger(a)||a<1||a>max) return 'Choose how many are attending.';
  if(sum(dr.diet)>a) return 'Main-course allocation exceeds your headcount.';
  for(const o of ['meals','allergies']) for(const k in dr[o]) if(dr[o][k]>a||dr[o][k]<0) return 'A selection exceeds your headcount.';
  if(dr.acc.required===null) return 'Please answer the accommodation question.';
  if(dr.acc.required&&(dr.acc.count<1||dr.acc.count>a)) return 'Accommodation headcount must be between 1 and '+a+'.';
  return null;
}
function submit(){
  const ev=S.ev; if(ev.submitting) return;
  const bad=validate(); if(bad){ ev.err=bad; return render(); }
  const d=ev.data, diet=d.diet||{}, dr=ev.draft, unalloc=(diet.categories||[]).length?dr.attendance-sum(dr.diet):0;
  const go=()=>doSubmit();
  if(unalloc>0) confirmBox('Some guests have no main-course choice','Submit anyway? You can change this later until the food deadline.','Submit',go); else go();
}
async function doSubmit(){
  const ev=S.ev, d=ev.data, dr=ev.draft, diet=d.diet||{}, editing=!!ev.sub;
  const pick=(obj,keys)=>Object.fromEntries(keys.filter(k=>+obj[k]>0).map(k=>[k,+obj[k]]));
  const body={attendance:dr.attendance,diet:pick(dr.diet,(diet.categories||[]).map(c=>c.key)),
    meals:pick(dr.meals,(diet.meals||[]).flatMap(s=>(s.options||[]).map(o=>o.key))),allergies:pick(dr.allergies,(diet.allergies||[]).map(a=>a.key)),

    await api('/api/guest/events/'+encodeURIComponent(ev.id)+'/submission',{method:editing?'PUT':'POST',body});
    await loadEvent(true);                       // show exactly what the backend stored
    ev.submitting=false; ev.mode='story'; ev.chapter=chapters().length-1; toast(editing?'Your changes were saved.':'Attendance confirmed. Thank you!'); refreshEvents(); render();

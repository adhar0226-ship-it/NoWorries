<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Host Portal — NOWORRIES</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#211d19">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   1. TOKENS & BASE
   ========================================================================== */
:root{
  --paper:#faf7f2; --surface:#ffffff; --ink:#211d19; --ink-2:#2c2722; --text:#1e1b18; --muted:#6a625a;
  --line:#e6dfd2; --line-strong:#d4cbbd; --rust:#b8470f; --rust-hover:#9f3c0b; --rust-soft:#f6e6dc;
  --sage:#5f7a66; --sage-soft:#e3ece6; --danger:#b3261e; --danger-soft:#fbe9e7; --warn-soft:#fbf1dc; --warn:#8a5a00;
  --ready:#2e9d5b; --ready-soft:#e4f4ea;
  --font-display:'Playfair Display',Georgia,serif;
  --font-body:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --r:8px; --r-lg:12px; --side:252px; --bottom:68px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px;-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--text);font-family:var(--font-body);line-height:1.55;-webkit-font-smoothing:antialiased;min-height:100vh}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
:focus-visible{outline:2px solid var(--rust);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
h1,h2,h3{font-family:var(--font-display);font-weight:700;letter-spacing:-.01em;line-height:1.2}
.muted{color:var(--muted)}
.hidden{display:none!important}

/* ==========================================================================
   2. BUTTONS, FIELDS, FEEDBACK
   ========================================================================== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:0 18px;border-radius:var(--r);font-weight:600;font-size:.93rem;border:1.5px solid transparent;transition:background .2s,border-color .2s,color .2s,transform .15s;white-space:nowrap}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.btn-primary{background:var(--rust);color:#fff}.btn-primary:hover:not([disabled]){background:var(--rust-hover)}
.btn-secondary{background:var(--surface);border-color:var(--line-strong)}.btn-secondary:hover:not([disabled]){border-color:var(--rust);color:var(--rust)}
.btn-ghost{color:var(--muted);padding:0 10px}.btn-ghost:hover{color:var(--rust)}
.btn-danger{background:var(--danger);color:#fff}.btn-danger:hover:not([disabled]){background:#951e17}
.btn-sm{min-height:34px;padding:0 12px;font-size:.85rem}
.btn-block{width:100%}
.spin{width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}

.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.field label,.label{font-size:.88rem;font-weight:600;color:var(--text)}
.field .hint{font-size:.82rem;color:var(--muted)}
.input,.select,.textarea{width:100%;min-height:44px;padding:10px 12px;background:var(--surface);border:1.5px solid var(--line-strong);border-radius:var(--r);transition:border-color .2s,box-shadow .2s}
.textarea{min-height:92px;resize:vertical}
.input:focus,.select:focus,.textarea:focus{outline:none;border-color:var(--rust);box-shadow:0 0 0 3px rgba(184,71,15,.12)}
.field.invalid .input,.field.invalid .textarea,.field.invalid .select{border-color:var(--danger)}
.err{font-size:.82rem;color:var(--danger);min-height:0}
.err:empty{display:none}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}
.pwd-wrap{position:relative}.pwd-wrap .input{padding-right:64px}
.pwd-toggle{position:absolute;right:6px;top:6px;height:32px;padding:0 10px;font-size:.82rem;font-weight:600;color:var(--muted)}

.check{display:flex;align-items:center;gap:10px;min-height:40px;cursor:pointer;font-size:.95rem}
.check input{width:18px;height:18px;accent-color:var(--rust);flex-shrink:0}
.check input:disabled+span{color:var(--muted)}

.notice{display:flex;gap:10px;padding:12px 14px;border-radius:var(--r);font-size:.9rem;margin-bottom:16px;border:1px solid}
.notice-error{background:var(--danger-soft);border-color:#f0c4bf;color:#7a1a14}
.notice-info{background:var(--sage-soft);border-color:#c8d9ce;color:#2f4a38}
.notice-warn{background:var(--warn-soft);border-color:#ecd9a8;color:var(--warn)}

#toasts{position:fixed;z-index:3000;top:16px;right:16px;display:flex;flex-direction:column;gap:10px;max-width:calc(100vw - 32px);pointer-events:none}
.toast{pointer-events:auto;background:var(--ink);color:#fff;padding:12px 16px;border-radius:var(--r);font-size:.9rem;box-shadow:0 10px 30px rgba(0,0,0,.2);border-left:4px solid var(--sage);animation:toastIn .25s ease;max-width:380px}
.toast.error{border-left-color:#e5675d}
@keyframes toastIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}

.modal-back{position:fixed;inset:0;z-index:2000;background:rgba(33,29,25,.55);display:flex;align-items:center;justify-content:center;padding:20px;animation:fade .2s ease}
.modal{background:var(--surface);border-radius:var(--r-lg);padding:28px;width:100%;max-width:440px;box-shadow:0 24px 60px rgba(0,0,0,.25)}
.modal h3{font-size:1.35rem;margin-bottom:10px}
.modal p{color:var(--muted);margin-bottom:22px}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.sheet-list{display:flex;flex-direction:column;margin:-6px 0 6px}
.sheet-item{display:flex;align-items:center;gap:14px;padding:14px 4px;border-bottom:1px solid var(--line);text-align:left;font-weight:600}
.sheet-item:last-child{border-bottom:0}.sheet-item:hover{color:var(--rust)}
@keyframes fade{from{opacity:0}to{opacity:1}}

.skel{background:linear-gradient(90deg,#eee7da 25%,#f6f1e7 37%,#eee7da 63%);background-size:400% 100%;animation:shimmer 1.4s ease infinite;border-radius:var(--r)}
@keyframes shimmer{0%{background-position:100% 50%}100%{background-position:0 50%}}

/* ==========================================================================
   3. FULL-SCREEN STATES (splash, connection, auth)
   ========================================================================== */
.center-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.splash{flex-direction:column;gap:18px}
.splash .brand-word{font-family:var(--font-display);font-size:1.6rem;letter-spacing:.06em;font-weight:700}
.conn{max-width:480px;text-align:center}
.conn .mark{width:64px;height:64px;margin:0 auto 22px;border-radius:50%;background:var(--rust-soft);color:var(--rust);display:flex;align-items:center;justify-content:center}
.conn .mark svg{width:30px;height:30px}
.conn h1{font-size:1.9rem;margin-bottom:12px}
.conn p{color:var(--muted);margin-bottom:26px}
.conn .detail{font-size:.82rem;color:var(--muted);margin-top:18px}

.auth{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);min-height:100vh}
.auth-art{background:var(--ink);color:#f4eee4;padding:56px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.auth-art::after{content:"";position:absolute;right:-120px;bottom:-120px;width:420px;height:420px;border:1px solid rgba(244,238,228,.14);border-radius:50%}
.auth-art::before{content:"";position:absolute;right:-60px;bottom:-60px;width:300px;height:300px;border:1px solid rgba(244,238,228,.1);border-radius:50%}
.auth-art .brand-word{font-family:var(--font-display);font-size:1.5rem;font-weight:700;letter-spacing:.08em}
.auth-art h2{font-size:clamp(2rem,3.2vw,3rem);max-width:460px;margin-bottom:16px}
.auth-art p{color:#c9bfb0;max-width:420px}
.auth-panel{display:flex;align-items:center;justify-content:center;padding:40px 24px}
.auth-card{width:100%;max-width:440px}
.auth-card h1{font-size:2rem;margin-bottom:6px}
.auth-card .sub{color:var(--muted);margin-bottom:26px}
.auth-tabs{display:flex;gap:26px;border-bottom:1px solid var(--line);margin-bottom:26px}
.auth-tab{padding:10px 0;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.auth-tab.active{color:var(--text);border-color:var(--rust)}
.auth-links{display:flex;justify-content:space-between;margin-top:18px;font-size:.9rem}
.auth-links button{color:var(--rust);font-weight:600}

/* ==========================================================================
   4. APP SHELL
   ========================================================================== */
.shell{min-height:100vh}
.side{position:fixed;inset:0 auto 0 0;width:var(--side);background:var(--ink);color:#e9e2d6;display:flex;flex-direction:column;padding:26px 14px 18px;z-index:50}
.side .brand-word{font-family:var(--font-display);font-size:1.35rem;font-weight:700;letter-spacing:.08em;padding:0 12px;margin-bottom:6px;color:#fff}
.side .portal{padding:0 12px;color:#a89f90;font-size:.85rem;margin-bottom:30px}
.nav{display:flex;flex-direction:column;gap:2px;flex:1}
.nav-link{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:var(--r);color:#cfc6b8;font-size:.94rem;font-weight:500;position:relative;transition:background .2s,color .2s}
.nav-link:hover{background:rgba(255,255,255,.06);color:#fff}
.nav-link.active{background:rgba(255,255,255,.09);color:#fff}
.nav-link.active::before{content:"";position:absolute;left:-14px;top:10px;bottom:10px;width:3px;background:var(--rust);border-radius:0 3px 3px 0}
.side-foot{border-top:1px solid rgba(255,255,255,.1);padding-top:16px;display:flex;flex-direction:column;gap:12px}
.hostcard{padding:0 12px;min-width:0}
.hostcard b{display:block;color:#fff;font-size:.93rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hostcard span{color:#a89f90;font-size:.8rem;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side .signout{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:var(--r);color:#cfc6b8;font-size:.92rem;width:100%}
.side .signout:hover{background:rgba(255,255,255,.06);color:#fff}

.main{margin-left:var(--side);min-height:100vh;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:40;background:rgba(250,247,242,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 40px;min-height:68px}
.top h1{font-size:1.45rem}
.top-r{display:flex;align-items:center;gap:16px;min-width:0}
.ev-select{min-width:0;max-width:280px;min-height:38px;padding:6px 10px;font-size:.9rem}
.live{display:flex;align-items:center;gap:7px;font-size:.82rem;color:var(--muted);white-space:nowrap}
.live i{width:8px;height:8px;border-radius:50%;background:var(--line-strong)}
.live.on i{background:var(--ready);animation:pulseG 2.4s ease-in-out infinite}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--sage);color:#fff;font-weight:700;font-size:.9rem;display:flex;align-items:center;justify-content:center;flex-shrink:0}
#view{padding:36px 40px 80px;max-width:1180px;width:100%;margin:0 auto;outline:none}
.subtabs{display:none}
.bottom{display:none}

/* ==========================================================================
   5. CONTENT PRIMITIVES
   ========================================================================== */
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:30px;flex-wrap:wrap}
.page-head h2{font-size:clamp(1.7rem,3vw,2.4rem)}
.page-head p{color:var(--muted);margin-top:6px}
.eyebrow{font-size:.92rem;color:var(--rust);font-weight:600;margin-bottom:6px}
.section{margin-bottom:44px}
.section-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:16px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.section-head h3{font-size:1.25rem}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:24px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));border-top:1px solid var(--line-strong);border-bottom:1px solid var(--line-strong);margin-bottom:44px}
.stat{padding:22px 20px;border-right:1px solid var(--line)}
.stat:last-child{border-right:0}
.stat .v{font-family:var(--font-display);font-size:2.5rem;font-weight:700;line-height:1.1}
.stat .l{color:var(--muted);font-size:.9rem;margin-top:4px}
.split{display:grid;grid-template-columns:1.2fr 1fr;gap:48px}
.hero-event{display:flex;gap:24px;align-items:center;padding:26px 0;border-bottom:1px solid var(--line);margin-bottom:36px;flex-wrap:wrap}
.couple{display:flex;align-items:center}
.photo{width:72px;height:72px;border-radius:50%;object-fit:cover;background:var(--sage-soft);border:3px solid var(--paper);display:flex;align-items:center;justify-content:center;color:var(--sage);font-family:var(--font-display);font-weight:700;font-size:1.4rem;overflow:hidden;flex-shrink:0}
.photo+.photo{margin-left:-16px}
.hero-event h3{font-size:1.6rem}
.hero-event .meta{color:var(--muted);font-size:.92rem;margin-top:4px}
.count-badge{margin-left:auto;text-align:right}
.count-badge b{font-family:var(--font-display);font-size:2.2rem;display:block;line-height:1}
.count-badge span{color:var(--muted);font-size:.88rem}

.bars{display:flex;flex-direction:column;gap:14px}
.bar-row .top-line{display:flex;justify-content:space-between;font-size:.93rem;margin-bottom:6px}
.bar-row b{font-variant-numeric:tabular-nums}
.track{height:8px;background:#eee7da;border-radius:4px;overflow:hidden}
.fill{height:100%;background:var(--sage);border-radius:4px;transition:width .7s cubic-bezier(.2,.8,.2,1)}
.fill.rust{background:var(--rust)}
.rows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:minmax(0,1.6fr) repeat(3,minmax(0,1fr)) auto;gap:14px;align-items:center;padding:16px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row.head{padding:8px 0;color:var(--muted);font-size:.85rem;font-weight:600;border-bottom:1px solid var(--line-strong)}
.row .name{font-weight:600;min-width:0;overflow-wrap:anywhere}
.row .sub{display:block;font-weight:400;color:var(--muted);font-size:.85rem}
.row .actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.08em;font-weight:600}
.chip{display:inline-block;padding:2px 9px;border-radius:5px;background:var(--sage-soft);color:#2f4a38;font-size:.82rem;font-weight:600;margin:2px 4px 2px 0}

.empty{text-align:center;padding:56px 24px;border:1.5px dashed var(--line-strong);border-radius:var(--r-lg)}
.empty h3{font-size:1.45rem;margin-bottom:8px}
.empty p{color:var(--muted);max-width:420px;margin:0 auto 22px}
.empty svg.art{width:56px;height:56px;color:var(--line-strong);stroke-width:1.2;margin-bottom:14px}
.errblock{padding:22px;border:1px solid #f0c4bf;background:var(--danger-soft);border-radius:var(--r-lg);color:#7a1a14}
.errblock.unavail{background:var(--warn-soft);border-color:#ecd9a8;color:var(--warn)}
.errblock h4{font-size:1rem;margin-bottom:4px}
.errblock p{font-size:.9rem;margin-bottom:12px}

/* Preparation status */
.status{display:inline-flex;align-items:center;gap:9px;font-weight:600;font-size:.92rem}
.status i{width:11px;height:11px;border-radius:50%;flex-shrink:0}
.status.notready{color:#b3261e}
.status.notready i{background:#e0281e;animation:blinkR 1s steps(2,start) infinite}
.status.ready{color:#1f7a45}
.status.ready i{background:#7fd6a0;box-shadow:0 0 0 0 rgba(46,157,91,.4);animation:pulseG 2.8s ease-in-out infinite}
@keyframes blinkR{to{opacity:.15}}
@keyframes pulseG{0%,100%{box-shadow:0 0 0 0 rgba(46,157,91,.35)}50%{box-shadow:0 0 0 6px rgba(46,157,91,0)}}
.prep-item{display:flex;justify-content:space-between;align-items:center;padding:18px 0;border-bottom:1px solid var(--line);gap:12px}
.prep-item:last-child{border-bottom:0}
.prep-item b{font-size:1.02rem}

/* Forms (event + food) */
.form-wrap{max-width:820px}
.fsec{margin-bottom:38px}
.fsec>h3{font-size:1.25rem;padding-bottom:10px;border-bottom:1px solid var(--line);margin-bottom:20px}
.photo-field{display:flex;gap:16px;align-items:center}
.photo-prev{width:88px;height:88px;border-radius:50%;background:var(--sage-soft);overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--sage);flex-shrink:0}
.photo-prev img{width:100%;height:100%;object-fit:cover}
.photo-prev svg{width:30px;height:30px}
.photo-ctl{flex:1;min-width:0}
.prog{height:6px;background:#eee7da;border-radius:3px;overflow:hidden;margin-top:8px}
.prog>div{height:100%;width:0;background:var(--rust);transition:width .15s}
.tl-row{display:grid;grid-template-columns:1.4fr 1fr .8fr auto;gap:10px;align-items:start;margin-bottom:12px;padding-bottom:12px;border-bottom:1px dashed var(--line)}
.tl-row .desc{grid-column:1/4}
.tl-row .rm{margin-top:2px}
.form-foot{display:flex;gap:12px;padding-top:20px;border-top:1px solid var(--line);flex-wrap:wrap}
.opt-list{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.opt{display:inline-flex;align-items:center;gap:6px;padding:4px 6px 4px 12px;background:var(--surface);border:1px solid var(--line-strong);border-radius:6px;font-size:.9rem}
.opt button{width:22px;height:22px;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.opt button:hover{color:var(--danger)}
.opt svg{width:14px;height:14px}
.add-line{display:flex;gap:8px}
.meal-block{padding:18px 0;border-bottom:1px solid var(--line)}
.meal-block:last-child{border-bottom:0}
.allergy-row{display:grid;grid-template-columns:1.2fr 1fr 1fr auto;gap:12px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.radio-card{display:flex;gap:12px;align-items:flex-start;padding:14px;border:1.5px solid var(--line-strong);border-radius:var(--r);margin-bottom:10px;cursor:pointer;background:var(--surface)}
.radio-card:has(input:checked){border-color:var(--rust);background:var(--rust-soft)}
.radio-card input{margin-top:4px;accent-color:var(--rust)}
.radio-card b{display:block}
.radio-card span{font-size:.88rem;color:var(--muted)}

.idbox{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:20px 22px;background:var(--ink);color:#fff;border-radius:var(--r-lg)}
.idbox .code{font-size:1.7rem;color:#fff}
.idbox .muted{color:#b9afa0;font-size:.85rem}
.kv{display:grid;grid-template-columns:150px 1fr;gap:10px 18px;font-size:.95rem}
.kv dt{color:var(--muted)}
.kv dd{overflow-wrap:anywhere}
.tline{list-style:none;border-left:2px solid var(--line-strong);margin-left:6px}
.tline li{padding:0 0 22px 22px;position:relative}
.tline li::before{content:"";position:absolute;left:-7px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--paper);border:2px solid var(--rust)}
.tline b{display:block}.tline span{color:var(--muted);font-size:.9rem}

/* ==========================================================================
   6. RESPONSIVE
   ========================================================================== */
@media (max-width:1100px){.split{grid-template-columns:1fr;gap:36px}}
@media (max-width:900px){
  .side{display:none}
  .main{margin-left:0;padding-bottom:calc(var(--bottom) + env(safe-area-inset-bottom))}
  .top{padding:12px 18px;min-height:60px}.top h1{font-size:1.2rem}
  #view{padding:22px 18px 40px}
  .ev-select{max-width:160px}
  .live span{display:none}
  .subtabs{display:flex;overflow-x:auto;gap:22px;padding:0 18px;border-bottom:1px solid var(--line);background:var(--paper);scrollbar-width:none}
  .subtabs::-webkit-scrollbar{display:none}
  .subtabs a{padding:12px 0;font-size:.9rem;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
  .subtabs a.active{color:var(--text);border-color:var(--rust)}
  .bottom{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--surface);border-top:1px solid var(--line-strong);padding:6px 6px calc(6px + env(safe-area-inset-bottom));height:calc(var(--bottom) + env(safe-area-inset-bottom))}
  .bn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:.72rem;font-weight:600;color:var(--muted);min-height:52px;border-radius:var(--r)}
  .bn.active{color:var(--rust)}
  .bn-plus{position:relative}

const validPhone = v => /^\+?[0-9\s\-()]{8,18}$/.test(v) && v.replace(/\D/g,'').length >= 8 && v.replace(/\D/g,'').length <= 15;
function firebaseAuthMessage(e){
  switch(e && e.code){
    case 'auth/invalid-credential': case 'auth/wrong-password': case 'auth/user-not-found': case 'auth/invalid-email': return 'Incorrect email or password.';
    case 'auth/too-many-requests': return 'Too many attempts. Please wait a few minutes and try again.';
    case 'auth/user-disabled': return 'This account has been disabled.';
    case 'auth/network-request-failed': return navigator.onLine ? 'Could not reach the authentication service. Try again shortly.' : 'You appear to be offline.';
    default: return 'Sign in failed. Please try again.';
  }
}
const forms = {
  async login(form){
    clearErrs(form);
    const email = form.email.value.trim(), password = form.password.value;
    let bad = false;
    if(!validEmail(email)){ setErr(form,'email','Enter a valid email address.'); bad = true; }
    if(!password){ setErr(form,'password','Enter your password.'); bad = true; }
    if(bad || state.busyAuth) return;
    const btn = $('button[type=submit]', form); state.busyAuth = true; setBusy(btn, true, 'Signing in');
    try { await state.fb.auth.signInWithEmailAndPassword(email, password); }
    catch(e){ state.busyAuth = false; setBusy(btn, false); setErr(form,'_form', firebaseAuthMessage(e)); }
  },
  async register(form){
    clearErrs(form);
    const v = { name: form.name.value.trim(), email: form.email.value.trim(), phone: form.phone.value.trim(), password: form.password.value, confirm: form.confirm.value };
    let bad = false;
    if(v.name.length < 2){ setErr(form,'name','Enter your full name.'); bad = true; }
    if(!validEmail(v.email)){ setErr(form,'email','Enter a valid email address.'); bad = true; }
    if(!validPhone(v.phone)){ setErr(form,'phone','Enter a valid phone number.'); bad = true; }
    if(v.password.length < 8 || !/[a-z]/.test(v.password) || !/[A-Z]/.test(v.password) || !/[0-9]/.test(v.password)){ setErr(form,'password','Use 8+ characters with upper case, lower case and a number.'); bad = true; }
    if(v.confirm !== v.password){ setErr(form,'confirm','Passwords do not match.'); bad = true; }
    if(bad || state.busyAuth) return;
    const btn = $('button[type=submit]', form); state.busyAuth = true; setBusy(btn, true, 'Creating account');
    try { await api('/api/auth/host/register', { method:'POST', auth:false, body:{ name:v.name, email:v.email, phone:v.phone, password:v.password } }); }
    catch(e){
      state.busyAuth = false; setBusy(btn, false);
      if(e.kind === 'conflict') return setErr(form,'email', e.message || 'This email is already registered on NOWORRIES.');
      if(e.kind === 'unavailable') return setErr(form,'_form','Registration is not available on the server yet.');
      return setErr(form,'_form', e.kind === 'validation' ? e.message : errorText(e));
    }
    try { await state.fb.auth.signInWithEmailAndPassword(v.email, v.password); }
    catch(e){ state.busyAuth = false; state.authNotice = { type:'info', text:'Your account was created. Please sign in.' }; renderAuth('login'); }
  },
  async forgot(form){
    clearErrs(form);
    const email = form.email.value.trim();
    if(!validEmail(email)) return setErr(form,'email','Enter a valid email address.');
    const btn = $('button[type=submit]', form); setBusy(btn, true, 'Sending');
    try {
      await api('/api/auth/host/forgot-password', { method:'POST', auth:false, body:{ email } });
      state.authNotice = { type:'info', text:'If an account exists for that email, a reset link is on its way.' };
      renderAuth('login');
    } catch(e){ setBusy(btn, false); setErr(form,'_form', e.kind === 'unavailable' ? 'Password reset is not available on the server yet.' : errorText(e)); }
  }
};
function errorText(e){
  switch(e && e.kind){
    case 'network': return 'You appear to be offline. Check your connection and try again.';
    case 'unreachable': case 'timeout': return 'Unable to reach NOWORRIES servers. Please try again shortly.';
    case 'server': return 'The server reported an error. Please try again shortly.';
    case 'unavailable': return 'This feature is not available on the server yet.';
    case 'forbidden': return 'You are not authorised to do this.';
    case 'ratelimit': return e.message;
    default: return (e && e.message) || 'Something went wrong.';
  }
}

function enterApp(){

  if(!location.hash || location.hash === '#') location.hash = '#/home';

function parseHash(){
  const p = (location.hash.replace(/^#\/?/, '') || 'home').split('/');
  return { name: p[0] || 'home', id: p[1] ? decodeURIComponent(p[1]) : null, sub: p[2] || null };
}
function navKey(r){ return (r.name === 'event' || r.name === 'create') ? 'events' : r.name; }
function updateNavActive(r){
  const k = navKey(r);
  $$('[data-nav]').forEach(a => { a.classList.toggle('active', a.dataset.nav === k); if(a.dataset.nav === k) a.setAttribute('aria-current','page'); else a.removeAttribute('aria-current'); });
  const st = $('#subtabs');
  if(st){
    if(SCOPED.includes(r.name)){ st.innerHTML = SCOPED.map(id => { const n = NAV.find(x => x.id === id); return `<a href="#/${id}" class="${id===r.name?'active':''}">${esc(n.label)}</a>`; }).join(''); st.style.display = ''; }
    else { st.innerHTML = ''; st.style.display = 'none'; }
  }
}
function renderTopbar(){
  const sel = $('#evSelect'); if(!sel) return;
  const ev = state.events || [];
  if(!ev.length){ sel.classList.add('hidden'); return; }
  sel.classList.remove('hidden');
  sel.innerHTML = ev.map(e => `<option value="${esc(e.id)}" ${e.id===state.selectedEventId?'selected':''}>${esc(coupleName(e))}</option>`).join('');
}
function setLive(on, text){
  const l = $('#live'); if(!l) return;
  l.classList.toggle('on', !!on); $('span', l).textContent = text || '';
}
const VIEWS = {};
async function renderRoute(silent=false){
  if(!state.host) return;
  const r = parseHash(); const token = ++navToken;
  updateNavActive(r);
  const view = $('#view'); if(!view) return;
  const fn = VIEWS[r.name] || VIEWS.home;
  if(!silent){ view.innerHTML = skeleton(); window.scrollTo(0, 0); }
  try {
    const out = await fn(r);
    if(token !== navToken) return;
    $('#pageTitle').textContent = out.title;
    document.title = out.title + ' — NOWORRIES Host';
    view.innerHTML = out.html;
    if(out.after) out.after(view, r);
  } catch(e){
    if(token !== navToken) return;
    if(e.kind === 'unauthenticated') return;
    view.innerHTML = errorBlock(e);
  }
}
window.addEventListener('hashchange', () => { if(state.host) renderRoute(); });
window.addEventListener('offline', () => toast('You are offline.', 'error'));
window.addEventListener('online', () => toast('Back online.'));

/* ---------- 9. EVENT DATA HELPERS & REALTIME ---------- */
async function ensureEvents(force=false){
  if(state.events && !force) return state.events;
  const d = await api('/api/host/events');
  state.events = (d && (d.events || d)) || [];
  if(!Array.isArray(state.events)) state.events = [];
  if(!state.events.some(e => e.id === state.selectedEventId)) state.selectedEventId = state.events[0] ? state.events[0].id : null;
  persistSel(); renderTopbar();
  return state.events;
}
function persistSel(){ try { state.selectedEventId ? sessionStorage.setItem('nw_host_event', state.selectedEventId) : sessionStorage.removeItem('nw_host_event'); } catch {} }
async function ensureSelected(){
  const events = await ensureEvents();
  if(!events.length) return null;
  if(state.eventDetail && state.eventDetail.id === state.selectedEventId) return state.eventDetail;
  return loadEventDetail(state.selectedEventId);
}
async function loadEventDetail(id){
  const d = await api('/api/host/events/' + enc(id));
  const ev = d && (d.event || d);
  state.eventDetail = ev;
  if(state.selectedEventId === id) subscribeRealtime(ev.realtimePath);
  return ev;
}
function selectEvent(id){
  state.selectedEventId = id; state.eventDetail = null; persistSel(); state.foodDraft = null;
  teardownRealtime(); renderTopbar(); renderRoute();
}
function teardownRealtime(){
  clearTimeout(state.rtTimer);
  if(state.rtRef && state.rtHandler){ try { state.rtRef.off('value', state.rtHandler); } catch {} }
  state.rtRef = null; state.rtHandler = null; setLive(false, '');
}
function subscribeRealtime(path){
  teardownRealtime();
  if(!path || !state.fb || !state.fb.db){ setLive(false, 'Live updates unavailable'); return; }
  try {
    const ref = state.fb.db.ref(path); let first = true;
    const handler = ref.on('value', () => {
      if(first){ first = false; return; }
      clearTimeout(state.rtTimer);
      state.rtTimer = setTimeout(() => { if(['home','guests','accommodation','caterer'].includes(parseHash().name)) renderRoute(true); }, 400);
    }, () => setLive(false, 'Live updates unavailable'));
    state.rtRef = ref; state.rtHandler = handler; setLive(true, 'Live');
  } catch { setLive(false, 'Live updates unavailable'); }
}
const evPath = (id, tail='') => `/api/host/events/${enc(id)}${tail}`;

/* ---------- 10. SHARED VIEW COMPONENTS ---------- */
function noEventState(){
  return `<div class="empty">${icon('calendar','art')}<h3>No events yet</h3><p>Create your first wedding event to start collecting RSVPs, dietary needs and accommodation details.</p>
    <a class="btn btn-primary" href="#/create">Create an event</a></div>`;
}
function bars(items, total, cls=''){
  if(!items || !items.length) return '<p class="muted">No data yet.</p>';
  const max = Math.max(1, ...items.map(i => Number(i.count)||0), Number(total)||0);
  return `<div class="bars">${items.map(i => `<div class="bar-row"><div class="top-line"><span>${esc(i.label)}</span><b>${num(i.count)}</b></div>
    <div class="track"><div class="fill ${cls}" style="width:${Math.round((Number(i.count)||0)/max*100)}%"></div></div></div>`).join('')}</div>`;
}
function statusHtml(s){
  return s === 'ready' ? '<span class="status ready"><i></i>Ready</span>' : '<span class="status notready"><i></i>Not Ready</span>';
}
function section(title, body, action=''){ return `<section class="section"><div class="section-head"><h3>${esc(title)}</h3>${action}</div>${body}</section>`; }
function photoEl(url, name){
  const u = safeUrl(url);
  return u ? `<img class="photo" src="${esc(u)}" alt="${esc(name)}" referrerpolicy="no-referrer">` : `<div class="photo" aria-hidden="true">${esc(initials(name))}</div>`;
}
function eventBanner(ev, extra=''){
  const d = daysUntil(ev.weddingDate);
  const cnt = d === null ? '' : d > 0 ? `<div class="count-badge"><b>${d}</b><span>${d===1?'day':'days'} to go</span></div>` : d === 0 ? `<div class="count-badge"><b>Today</b><span>Wedding day</span></div>` : '';
  return `<div class="hero-event"><div class="couple">${photoEl(ev.bridePhotoUrl, ev.brideName)}${photoEl(ev.groomPhotoUrl, ev.groomName)}</div>
    <div><h3>${esc(coupleName(ev))}</h3><div class="meta">${esc(fmtDate(ev.weddingDate))} · ${esc(ev.venue || 'Venue not set')}</div>${extra}</div>${cnt}</div>`;
}

/* ---------- 11. VIEWS: HOME ---------- */
VIEWS.home = async () => {
  const h = new Date().getHours();
  const greet = h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening';
  const head = `<div class="page-head"><div><div class="eyebrow">Host ID ${esc(state.host.hostId)}</div><h2>${greet}, ${esc(state.host.name.split(' ')[0])}</h2>
    <p>Here is where your celebrations stand.</p></div><a class="btn btn-primary" href="#/create">${icon('plus')}New event</a></div>`;
  const events = await ensureEvents();
  if(!events.length) return { title:'Overview', html: head + noEventState() };
  const ev = await ensureSelected();
  const [an, pr] = await Promise.allSettled([api(evPath(ev.id,'/analytics')), api(evPath(ev.id,'/preparation'))]);
  let stats = '', dietBlock = '', accBlock = '';
  if(an.status === 'fulfilled'){
    const a = an.value;
    const tiles = [['Registered families', a.families], ['Confirmed attendees', a.confirmedAttendees]];
    if(a.pendingConfirmations !== undefined && a.pendingConfirmations !== null) tiles.push(['Pending confirmations', a.pendingConfirmations]);
    if(a.accommodation && a.accommodation.total !== undefined) tiles.push(['Need accommodation', a.accommodation.total]);
    stats = `<div class="stats">${tiles.map(t => `<div class="stat"><div class="v">${num(t[1])}</div><div class="l">${esc(t[0])}</div></div>`).join('')}</div>`;
    dietBlock = section('Dietary distribution', bars(a.diets, a.confirmedAttendees), '<a class="btn btn-ghost btn-sm" href="#/guests">Full analytics</a>');
    accBlock = '';
  } else { stats = `<div style="margin-bottom:44px">${errorBlock(an.reason)}</div>`; }
  const upcoming = events.filter(e => { const d = daysUntil(e.weddingDate); return d !== null && d >= 0; }).sort((a,b) => parseDay(a.weddingDate) - parseDay(b.weddingDate));
  const prepHtml = settled(pr, p => {
    const cats = p.categories || [];
    if(!cats.length) return '<p class="muted">No preparation categories have been published for this event yet.</p>';
    const ready = cats.filter(c => c.status === 'ready').length;
    return `<p class="muted" style="margin-bottom:6px">${ready} of ${cats.length} categories ready</p>` + cats.map(c => `<div class="prep-item"><b>${esc(c.label)}</b>${statusHtml(c.status)}</div>`).join('');
  });
  const upHtml = upcoming.length ? `<div class="rows">${upcoming.slice(0,5).map(e => `<a class="prep-item" href="#/event/${enc(e.id)}"><span><b>${esc(coupleName(e))}</b><br><span class="muted" style="font-size:.88rem">${esc(fmtDate(e.weddingDate,false))} · ${esc(e.venue||'')}</span></span><span class="muted">View</span></a>`).join('')}</div>` : '<p class="muted">No upcoming events.</p>';
  return { title:'Overview', html: head + eventBanner(ev) + stats +
    `<div class="split"><div>${dietBlock}${section('Upcoming events', upHtml)}</div><div>${section('Kitchen preparation', prepHtml, '<a class="btn btn-ghost btn-sm" href="#/caterer">Details</a>')}</div></div>` };
};

async function handlePhoto(input){
  const kind = input.dataset.photoInput, file = input.files[0]; if(!file) return;
  const box = $(`[data-photo="${kind}"]`), form = input.closest('form');
  const prog = $('.prog', box), bar = $('.prog>div', box), prev = $('.photo-prev', box);
  setErr(form, 'photo-' + kind, '');
  if(!UPLOAD_TYPES.includes(file.type)){ setErr(form,'photo-'+kind,'Use a JPG, PNG or WebP image.'); input.value=''; return; }
  if(file.size > UPLOAD_MAX_BYTES){ setErr(form,'photo-'+kind,'This image is larger than 5 MB.'); input.value=''; return; }
  const objUrl = URL.createObjectURL(file);
  prev.innerHTML = `<img src="${objUrl}" alt="">`;
  prog.classList.remove('hidden'); bar.style.width = '0';
  state.formPhotos[kind].uploading = true;
  try {
    const r = await uploadPhoto(file, kind, p => { bar.style.width = p + '%'; });
    state.formPhotos[kind] = { url: r.url, path: r.path || '', uploading:false };
    toast('Photo uploaded');
  } catch(e){
    state.formPhotos[kind].uploading = false;
    setErr(form,'photo-'+kind, errorText(e));
    prev.innerHTML = state.formPhotos[kind].url && safeUrl(state.formPhotos[kind].url) ? `<img src="${esc(safeUrl(state.formPhotos[kind].url))}" alt="">` : icon('image');
    input.value = '';
  } finally { prog.classList.add('hidden'); URL.revokeObjectURL(objUrl); }
}

function emptyFood(){
  return { diets: Object.fromEntries(DIETS.map(d => [d[0], false])),
    allergies: ALLERGY_PRESETS.map(([key,label]) => ({ key, label, listed:false, accommodated:false })),
    separation:'', meals: Object.fromEntries(MEALS.map(m => [m[0], { enabled:false, options:[] }])) };
}
function hydrateFood(cfg){
  const d = emptyFood(); if(!cfg) return d;
  DIETS.forEach(([k]) => { if(cfg.diets && k in cfg.diets) d.diets[k] = !!cfg.diets[k]; });
  (cfg.allergies||[]).forEach(a => {
    const ex = d.allergies.find(x => x.key === a.key);
    if(ex){ ex.listed = true; ex.accommodated = !!a.accommodated; }
    else d.allergies.push({ key: a.key || slug(a.label), label:String(a.label||''), listed:true, accommodated:!!a.accommodated, custom:true });
  });
  d.separation = cfg.separation || '';
  MEALS.forEach(([k]) => { const m = cfg.meals && cfg.meals[k]; if(m) d.meals[k] = { enabled: !!m.enabled, options: Array.isArray(m.options) ? m.options.map(String) : [] }; });
  return d;
}

  return `<div class="fsec"><h3>Dietary categories offered</h3><p class="muted" style="margin-bottom:10px">Only the categories you select appear for guests.</p>${diets}</div>
    <div class="fsec"><h3>Allergies &amp; intolerances</h3><p class="muted" style="margin-bottom:10px">Choosing an allergy lets guests declare it. It does not mean the kitchen can handle it — tick that separately.</p>${all}

      ${sel ? `<a class="sheet-item" href="#/event/${enc(sel)}" data-c>${icon('calendar')}View active event</a>
      <a class="sheet-item" href="#/event/${enc(sel)}/edit" data-c>${icon('food')}Edit active event</a>
      <button class="sheet-item" data-copy="${esc(sel)}">${icon('copy')}Copy invitation text</button>` : ''}</div>
      <div class="modal-actions"><button class="btn btn-secondary" data-x>Close</button></div>`);
    m.el.addEventListener('click', e => {
      if(e.target.closest('[data-c]') || e.target.closest('[data-x]')) m.close();
      const c = e.target.closest('[data-copy]'); if(c){ m.close(); actions['copy-invite']({ dataset:{ id:c.dataset.copy } }); }
    });
  },
  'reset-pw': async el => {
    setBusy(el, true, 'Sending');
    try { await api('/api/auth/host/forgot-password', { method:'POST', auth:false, body:{ email: state.host.email } }); toast('Reset link requested. Check your inbox.'); }
    catch(e){ toast(errorText(e), 'error'); } finally { setBusy(el, false); }
  },
  'add-allergy': () => {
    const i = $('#custAllergy'), label = i.value.trim(); if(!label) return;
    const key = slug(label);
    if(!key || state.foodDraft.allergies.some(a => a.key === key)){ toast('That restriction is already in the list.', 'error'); return; }
    state.foodDraft.allergies.push({ key, label, listed:true, accommodated:false, custom:true }); rerenderFood();
  },
  'rm-allergy': el => { state.foodDraft.allergies.splice(+el.dataset.i, 1); rerenderFood(); },
  'add-opt': el => {
    const k = el.dataset.key, i = $('#opt-' + k), v = i.value.trim(); if(!v) return;
    const list = state.foodDraft.meals[k].options;
    if(list.some(o => o.toLowerCase() === v.toLowerCase())) { toast('That option is already added.', 'error'); return; }
    list.push(v); rerenderFood(); const n = $('#opt-' + k); if(n) n.focus();
  },
  'rm-opt': el => { state.foodDraft.meals[el.dataset.key].options.splice(+el.dataset.i, 1); rerenderFood(); },
  'save-food': el => saveFood(el)
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]'); if(!el) return;
  const fn = actions[el.dataset.action]; if(fn){ if(el.tagName === 'BUTTON') e.preventDefault(); fn(el, e); }
});
document.addEventListener('submit', e => {
  const f = e.target.closest('[data-form]'); if(!f) return;
  e.preventDefault(); const fn = forms[f.dataset.form]; if(fn) fn(f);
});
document.addEventListener('change', e => {
  const t = e.target;
  if(t.matches('[data-photo-input]')) return handlePhoto(t);
  if(t.id === 'evSelect') return selectEvent(t.value);
  const kind = t.dataset && t.dataset.food; if(!kind || !state.foodDraft) return;
  const d = state.foodDraft;
  if(kind === 'diet') d.diets[t.dataset.key] = t.checked;
  else if(kind === 'sep') d.separation = t.value;
  else if(kind === 'meal'){ d.meals[t.dataset.key].enabled = t.checked; rerenderFood(); }
  else if(kind === 'al-listed'){ const a = d.allergies[+t.dataset.i]; a.listed = t.checked; if(!t.checked) a.accommodated = false; rerenderFood(); }
  else if(kind === 'al-acc') d.allergies[+t.dataset.i].accommodated = t.checked;
});
document.addEventListener('keydown', e => {
  if(e.key === 'Escape'){ const m = $('.modal-back:last-child'); if(m) m.remove(); }
  if(e.key === 'Enter' && e.target.dataset && e.target.dataset.optInput){ e.preventDefault(); actions['add-opt']({ dataset:{ key:e.target.dataset.optInput } }); }
  if(e.key === 'Enter' && e.target.id === 'custAllergy'){ e.preventDefault(); actions['add-allergy'](); }
});

/* ---------- 20. START ---------- */
boot();
})();
</script>
</body>
</html>
